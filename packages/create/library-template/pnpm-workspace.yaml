# NativeScript's bundler resolves dependencies from the flat package tree.
nodeLinker: hoisted
allowBuilds:
  esbuild: true
  '@parcel/watcher': true
  '@nativescript/core': false
# Shared version pins — bump these here, every dependency field reads them.
catalog:
  octane: 0.11.0
  '@nativescript-community/octane': 0.2.4
  '@nativescript/core': 9.1.3
  '@nativescript/types': 9.1.4
  typescript: 5.9.3
  vite: 8.3.0
  '@octanejs/vite-plugin': 0.1.61
  '@tsrx/typescript-plugin': 0.4.11
  vitest: 4.1.11
