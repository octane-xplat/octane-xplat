name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Release readiness: deterministic regressions, package integrity, and one
  # isolated packed web starter. Exhaustive consumers and devices qualify
  # stable on the release pull request in stable.yml.
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No Playwright/browser install — the checks job stays lightweight
      # (no device emulation either). Browser-dependent tasks are filtered
      # out below; they run locally, not in PR gating.
      - name: Generate declarations before checking consumers
        run: bun run typegen

      # Error-level correctness rules block releases; warning-level style
      # findings stay advisory. CSS runs once below, recipes in the PR job.
      - name: Lint code (oxlint + tsrx pass)
        run: bun run lint

      # check:decisions is deliberately absent — it mirrors the ledger against
      # the git-scoped Silo DB, which lives on dev machines, not in the checkout.
      # Package exports point at dist/ — repo-check probes execute the real
      # app vite configs, which load the cli dist closure.
      # This is the same task as "Prepare packages" below; the second run is
      # a turbo cache hit.
      - name: Prepare packages for repo checks
        run: bun run build:packages

      - name: Repo checks
        run: >-
          bun run check:compatibility && bun run check:patches && bun run check:ui-barrels && bun run check:css &&
          bun run check:suffix-resolution && bun run check:changelog && bun run check:doc-examples

      - name: Typecheck web
        run: bun run typecheck:web

      - name: Typecheck mobile
        run: bun run typecheck:mobile

      # @xplat/visual runs browser-mode vitest (Playwright) — excluded here;
      # it runs locally via the same `bun run test` script.
      - name: Test
        run: >-
          bun run turbo run test test:native --concurrency=2 --filter='!@xplat/visual' &&
          bun run test:create &&
          node --test examples/auth/server-verification.test.mjs && bun run test:scripts

      - name: Build web app
        run: bun run build:web

      # Runtime packages ship source; prepare declarations and required assets.
      - name: Prepare packages
        run: bun run build:packages

      - name: Check Bun patch installs
        run: bun run turbo run test:patches-install --filter=@octane-xplat/cli

      - name: Check standalone CLI executable
        run: bun run turbo run test:executable --filter=@octane-xplat/cli

      - name: Check packed exports and declaration dependencies
        run: bun run check:pack

      # Updates also exports a Node bootstrap hook. Its consumer fixture checks
      # that payload and six target conditions separately from declaration pairs.
      - name: Check Updates packed consumer
        run: bun run turbo run test:packed --filter=@octane-xplat/updates

      # The Node regression files already run in Test above.
      - name: Check optional service adapter types
        run: bun run check:optional-services --types-only

      # Real tarballs, isolated install, plain TypeScript declarations, and
      # starter web compilation. Full app/library journeys gate stable.
      - name: Packed web consumer smoke
        run: bun run check:consumer --no-build --quick

  repo-hygiene:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Bun owns the dependency cache; disable setup-node's automatic caching.
          package-manager-cache: false
      - name: Check public docs and package READMEs
        run: node scripts/check-docs.ts
      - name: Check recipe structure and documentation links
        run: node scripts/check-recipes.ts

  # Completing this workflow records ci evidence: the release workflow gates
  # the docs deploy, tsrx-typegen release, and lockstep stable publication on
  # it. Nightlies publish from this evidence on the release schedule instead.
  evidence:
    runs-on: ubuntu-latest
    needs: checks
    if: always() && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Bun owns the dependency cache; disable setup-node's automatic caching.
          package-manager-cache: false
      - name: Record CI evidence
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: >-
          node scripts/verify-release-evidence.ts record --track ci
          --jobs "$JOB_RESULTS" --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v6
        with:
          name: ci-evidence-ci-${{ github.sha }}
          path: .ci-evidence/ci-evidence.json
          if-no-files-found: error
          retention-days: 90
