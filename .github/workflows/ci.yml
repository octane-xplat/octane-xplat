name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gates every push/PR runs: lint, repo checks, both typecheck surfaces,
  # unit tests, web build, package builds, packed-payload checks, and the
  # packed-consumer/starter verification.
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No Playwright/browser install — the checks job stays lightweight
      # (no device emulation either). Browser-dependent tasks are filtered
      # out below; they run locally, not in PR gating.
      - name: Generate declarations before checking consumers
        run: pnpm typegen

      # Advisory only — style findings (xplat/spacing, unknown-class warnings)
      # shouldn't gate merges; structural coverage lives in "Repo checks".
      - name: Lint (oxlint + tsrx pass + recipes + css)
        continue-on-error: true
        run: pnpm lint

      # check:decisions is deliberately absent — it mirrors the ledger against
      # the git-scoped Silo DB, which lives on dev machines, not in the checkout.
      - name: Repo checks
        run: >-
          pnpm check:patches && pnpm check:ui-barrels && pnpm check:css && pnpm check:recipes &&
          pnpm check:suffix-resolution

      - name: Typecheck web
        run: pnpm typecheck:web

      - name: Typecheck mobile
        run: pnpm typecheck:mobile

      # @xplat/visual runs browser-mode vitest (Playwright) — excluded here;
      # it runs locally via the same `pnpm test` script.
      - name: Test
        run: >-
          pnpm exec turbo run test test:native --filter='!@xplat/visual' &&
          pnpm test:cli && pnpm test:create &&
          node --test examples/auth/server-verification.test.mjs && pnpm test:scripts

      - name: Build web app
        run: pnpm build:web

      # Runtime packages ship source; prepare declarations and required assets.
      - name: Prepare packages
        run: pnpm build:packages

      # workshop's test:packed is a Playwright browser journey — excluded
      # here; it runs locally via `pnpm test:packed`.
      - name: Check packed declarations and plain TypeScript consumers
        run: >-
          pnpm check:pack &&
          pnpm -r --filter './packages/**' --filter='!@octane-xplat/workshop' --if-present run test:packed

      - name: Check optional service adapters and native tests
        run: pnpm check:optional-services --no-browser

      # Release-path evidence: packs every publishable package, scaffolds a
      # starter via the PACKED create bin, installs it against file: tarballs
      # (no workspace links), then lints/typechecks/builds/doctor-checks the
      # consumer.
      - name: Packed consumer + starter verification
        run: pnpm check:consumer --no-build

  # Slow target jobs — release evidence only. They run on main pushes (PRs get
  # the full `checks` matrix above) because `ns build` costs 20-40 min cold.
  # Each runs inside the per-target advisory lock so parallel worktree/device
  # sessions on shared hosts serialize instead of fighting the same simulator.
  native-ios:
    runs-on: macos-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Produces a simulator-debug .app from the packed artifacts and proves
      # it installs + launches on a booted iPhone sim (simctl install/launch
      # on an already-booted device — ns run ios reboots and fails).
      - name: Packed consumer iOS build + simulator smoke
        run: node scripts/with-target-lock.mjs ios -- node scripts/verify-consumer.mjs --no-build --native ios --smoke-ios

  # Framework regression lane: the apps/mobile on-device Vitest suite runs in
  # the real NS runtime on a simulator. `ns test` builds the unitTesting
  # bundle and drives `ns run` inside the per-target advisory lock.
  native-ios-tests:
    runs-on: macos-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Hosted runners still ship Simulator.app, but pinning an explicit
      # booted device keeps the lane identical to Xcode 27 dev hosts (which
      # can only target already-booted simulators).
      - name: Boot an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devs=json.load(sys.stdin)["devices"]; print(next(d["udid"] for rt in devs.values() for d in rt if d["isAvailable"] and "iPhone" in d["name"]))')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Generate app routes for the bundle
        run: pnpm --filter @xplat/app gen

      # The unitTesting bundle's vite build exceeds Node's default 2GB heap
      # (OOM before emit → the .app has no bundle.js and the worker never
      # connects). macos runners have ~14GB; give the build headroom.
      - name: On-device Vitest suite (apps/mobile)
        run: node scripts/with-target-lock.mjs ios -- pnpm --filter @xplat/mobile test:ios -- --device "$SIM_UDID"
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'

  native-android:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Produces a debug .apk from the packed artifacts. Debug-signed artifact
      # — this is a build check, not Play-store distribution evidence. No
      # emulator runtime smoke yet (documented gap).
      - name: Packed consumer Android build
        run: node scripts/with-target-lock.mjs android -- node scripts/verify-consumer.mjs --no-build --native android
        env:
          # ns gates `build` on its doctor check, which requires a working
          # `emulator` binary — unused by a build-only lane and absent/broken
          # on hosted ubuntu runners. The gradle build itself is the gate.
          NS_SKIP_ENV_CHECK: 'true'

  # Final job: records per-job release evidence for THIS sha on every push,
  # failures included — release.yml's gate turns it into a channel
  # (all-green → stable, checks-only → nightly, checks-red → nothing). On
  # pull_request the native jobs are skipped and no evidence is needed, so
  # the job skips itself.
  evidence:
    runs-on: ubuntu-latest
    needs: [checks, native-ios, native-ios-tests, native-android]
    if: always() && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Record release evidence
        run: >-
          node scripts/verify-release-evidence.mjs record
          --jobs '${{ toJSON(needs) }}'
          --sha ${{ github.sha }}
          --run-id ${{ github.run_id }}
          --out .ci-evidence

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v6
        with:
          name: ci-evidence-${{ github.sha }}
          path: .ci-evidence/ci-evidence.json
          if-no-files-found: error
          retention-days: 90
