name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gates every push/PR runs: lint, repo checks, both typecheck surfaces,
  # unit tests, web build, package builds, packed-payload checks, the harness
  # browser smoke, and the packed-consumer/starter verification.
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate declarations before checking consumers
        run: pnpm typegen

      - name: Lint (oxlint + tsrx pass + recipes + css)
        run: pnpm lint

      - name: Repo checks
        run: >-
          pnpm check:patches && pnpm check:ui-barrels && pnpm check:css && pnpm check:recipes &&
          pnpm check:decisions && pnpm check:suffix-resolution

      - name: Typecheck web
        run: pnpm typecheck:web

      - name: Typecheck mobile
        run: pnpm typecheck:mobile

      - name: Test
        run: pnpm test

      - name: Build web app
        run: pnpm build:web

      # Publishable packages: proves dist artifacts + check-native-dist gates
      # pass before release.yml publishes them.
      - name: Build packages
        run: pnpm -r --filter './packages/**' --if-present run build

      - name: Check packed declarations and plain TypeScript consumers
        run: pnpm check:pack && pnpm test:packed

      - name: Install Playwright chromium
        run: pnpm --dir apps/web exec playwright install --with-deps chromium

      # Harness smoke — 59 assertions against the production web bundle.
      - name: Browser smoke
        run: pnpm --filter @xplat/web smoke

      # Release-path evidence: packs every publishable package, scaffolds a
      # starter via the PACKED create bin, installs it against file: tarballs
      # (no workspace links), then lints/typechecks/builds/doctor-checks the
      # consumer and browser-smokes its starter UI.
      - name: Packed consumer + starter verification
        run: pnpm check:consumer --no-build --smoke web

  # Slow target jobs — release evidence only. They run on main pushes (PRs get
  # the full `checks` matrix above) because `ns build` costs 20-40 min cold.
  # Each runs inside the per-target advisory lock so parallel worktree/device
  # sessions on shared hosts serialize instead of fighting the same simulator.
  native-ios:
    runs-on: macos-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Produces a simulator-debug .app from the packed artifacts and proves
      # it installs + launches on a booted iPhone sim (simctl install/launch
      # on an already-booted device — ns run ios reboots and fails).
      - name: Packed consumer iOS build + simulator smoke
        run: node scripts/with-target-lock.mjs ios -- node scripts/verify-consumer.mjs --no-build --native ios --smoke-ios

  native-android:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Produces a debug .apk from the packed artifacts. Debug-signed artifact
      # — this is a build check, not Play-store distribution evidence. No
      # emulator runtime smoke yet (documented gap).
      - name: Packed consumer Android build
        run: node scripts/with-target-lock.mjs android -- node scripts/verify-consumer.mjs --no-build --native android

  # Final job: records per-job release evidence for THIS sha. On push it must
  # see every required job green; on pull_request the native jobs are skipped
  # and no evidence is needed, so the job skips itself.
  evidence:
    runs-on: ubuntu-latest
    needs: [checks, native-ios, native-android]
    if: always() && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Record release evidence
        run: >-
          node scripts/verify-release-evidence.mjs record
          --jobs '${{ toJSON(needs) }}'
          --sha ${{ github.sha }}
          --run-id ${{ github.run_id }}
          --out .ci-evidence

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v6
        with:
          name: ci-evidence-${{ github.sha }}
          path: .ci-evidence/ci-evidence.json
          if-no-files-found: error
          retention-days: 90
