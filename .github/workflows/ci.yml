name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Nightly readiness: deterministic regressions, package integrity, and one
  # isolated packed web starter. Exhaustive consumers and devices live in stable.yml.
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No Playwright/browser install — the checks job stays lightweight
      # (no device emulation either). Browser-dependent tasks are filtered
      # out below; they run locally, not in PR gating.
      - name: Generate declarations before checking consumers
        run: pnpm typegen

      # Error-level correctness rules block releases; warning-level style
      # findings stay advisory. CSS runs once below, recipes in the PR job.
      - name: Lint code (oxlint + tsrx pass)
        run: pnpm lint --code-only

      # check:decisions is deliberately absent — it mirrors the ledger against
      # the git-scoped Silo DB, which lives on dev machines, not in the checkout.
      # Package exports point at dist/ — repo-check probes execute the real
      # app vite configs and every `xplat` bin call loads the dist closure.
      # This is the same task as "Prepare packages" below; the second run is
      # a turbo cache hit.
      - name: Prepare packages for repo checks
        run: pnpm build:packages

      - name: Repo checks
        run: >-
          pnpm check:compatibility && pnpm check:patches && pnpm check:ui-barrels && pnpm check:css &&
          pnpm check:suffix-resolution

      - name: Typecheck web
        run: pnpm typecheck:web

      - name: Typecheck mobile
        run: pnpm typecheck:mobile

      # @xplat/visual runs browser-mode vitest (Playwright) — excluded here;
      # it runs locally via the same `pnpm test` script.
      - name: Test
        run: >-
          pnpm exec turbo run test test:native --filter='!@xplat/visual' &&
          pnpm test:cli && pnpm test:create &&
          node --test examples/auth/server-verification.test.mjs && pnpm test:scripts

      - name: Build web app
        run: pnpm build:web

      # Runtime packages ship source; prepare declarations and required assets.
      - name: Prepare packages
        run: pnpm build:packages

      - name: Check packed exports and declaration dependencies
        run: pnpm check:pack

      # The Node regression files already run in Test above.
      - name: Check optional service adapter types
        run: pnpm check:optional-services --types-only

      # Real tarballs, isolated install, plain TypeScript declarations, and
      # starter web compilation. Full app/library journeys gate stable.
      - name: Packed web consumer smoke
        run: pnpm check:consumer --no-build --quick

  repo-hygiene:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # No pnpm in this job — disable v5's auto package-manager cache,
          # which would otherwise invoke pnpm for the detected lockfile.
          package-manager-cache: false
      - name: Check recipe structure and documentation links
        run: node scripts/check-recipes.ts

  # Completing this workflow releases the nightly and starts stable qualification
  # independently. Neither path waits for native jobs in this workflow.
  evidence:
    runs-on: ubuntu-latest
    needs: checks
    if: always() && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # No pnpm in this job — disable v5's auto package-manager cache,
          # which would otherwise invoke pnpm for the detected lockfile.
          package-manager-cache: false
      - name: Record nightly evidence
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: >-
          node scripts/verify-release-evidence.ts record --track nightly
          --jobs "$JOB_RESULTS" --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v6
        with:
          name: ci-evidence-nightly-${{ github.sha }}
          path: .ci-evidence/ci-evidence.json
          if-no-files-found: error
          retention-days: 90
