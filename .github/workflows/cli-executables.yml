name: CLI executables

on:
  workflow_dispatch:
  release:
    types: [published, edited]

concurrency:
  group: cli-executables-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  executable:
    if: github.event_name != 'release' || (github.event.action == 'published' && startsWith(github.event.release.tag_name, 'v')) || github.event.release.tag_name == 'nightly'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: windows-latest
            platform: windows-x64
            extension: .exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run turbo run test:executable --filter=@octane-xplat/cli
      - name: Name executable
        shell: bash
        run: |
          mkdir -p artifacts
          cp "packages/cli/dist/xplat${{ matrix.extension }}" "artifacts/xplat-${{ matrix.platform }}${{ matrix.extension }}"
          cd artifacts
          node --input-type=module -e 'import { createHash } from "node:crypto"; import { readFileSync, writeFileSync } from "node:fs"; const file = process.argv[1]; writeFileSync(file + ".sha256", createHash("sha256").update(readFileSync(file)).digest("hex") + "  " + file + "\n")' "xplat-${{ matrix.platform }}${{ matrix.extension }}"
      - uses: actions/upload-artifact@v4
        with:
          name: xplat-${{ matrix.platform }}
          path: artifacts/*
      - name: Attach to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" artifacts/* --clobber
