name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      track:
        description: Release channel to attempt
        type: choice
        options: [stable, nightly]
        default: stable
      typegen_version:
        description: tsrx-typegen version override (blank = Conventional Commit inference)
        required: false
        type: string

permissions:
  contents: read

jobs:
  # A completed main CI run supplies the channel: its evidence gates the docs
  # deploy, the tsrx-typegen release, and lockstep publication. Lockstep
  # releases arrive through the release pull request — its merge commit is
  # "pending" until its tag exists — and publish once the same tree carried
  # Stable CI evidence, or after this run qualifies it inline.
  gate:
    name: Resolve release channel
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
        inputs.track == 'stable' &&
        github.ref == 'refs/heads/main')
    permissions:
      contents: read
      actions: read
    outputs:
      channel: ${{ steps.evidence.outputs.channel }}
      sha: ${{ steps.evidence.outputs.sha }}
      lockstep_pending: ${{ steps.pending.outputs.pending }}
      lockstep_state: ${{ steps.pending.outputs.state }}
      # An unfinished publication resumes from the tagged commit; anything
      # else publishes the CI-tested sha.
      lockstep_sha: >-
        ${{ steps.pending.outputs.state == 'unpublished' && steps.pending.outputs.tag_sha ||
          steps.evidence.outputs.sha }}
      version: ${{ steps.pending.outputs.version }}
      tag: ${{ steps.pending.outputs.tag }}
      # A tag is only pushed after qualification, so 'unpublished' is already
      # qualified; 'untagged' still needs stable evidence or the qualify job.
      qualified: >-
        ${{ steps.qualification.outputs.channel == 'stable' ||
          steps.pending.outputs.state == 'unpublished' }}
    # The revision CI actually tested — publish must consume evidence for
    # this sha and build the tested code, not whatever main has moved to.
    env:
      TESTED_SHA: >-
        ${{ github.event_name == 'workflow_run' &&
            github.event.workflow_run.head_sha ||
            github.sha }}
      CI_RUN_ID: ${{ github.event.workflow_run.id || '' }}
    steps:
      - name: Checkout the tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TESTED_SHA }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          # Bun owns the dependency cache; disable setup-node's automatic caching.
          package-manager-cache: false

      - name: Verify CI release evidence
        id: evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node scripts/verify-release-evidence.ts verify --track ci
          --sha "$TESTED_SHA" ${CI_RUN_ID:+--run-id "$CI_RUN_ID"}

      - name: Check for a pending merged release
        if: steps.evidence.outputs.channel == 'ci'
        id: pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-version.ts pending lockstep >> "$GITHUB_OUTPUT"

      # A merged release tree that already passed Stable CI on the release PR
      # publishes immediately; `channel=none` here is expected and queues the
      # qualify job below instead of failing. Only an untagged release needs
      # the lookup — a pushed tag implies qualification already ran.
      - name: Verify stable qualification for this tree
        if: steps.pending.outputs.state == 'untagged'
        id: qualification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node scripts/verify-release-evidence.ts verify --track stable
          --tree "$(git rev-parse "$TESTED_SHA^{tree}")"

  # Docs deploy once per green main revision, independently of release lanes.
  docs:
    name: Deploy docs
    needs: gate
    runs-on: ubuntu-latest
    if: needs.gate.outputs.channel == 'ci'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.sha }}
          submodules: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # turbo so the declared workspace dep graph builds first — the docs
      # vite config imports @octane-xplat/cli/vite, which resolves to dist/.
      - name: Build docs site
        run: bun run turbo run build --filter=@xplat/docs

      - name: Deploy to Cloudflare Pages
        run: bun run --cwd apps/docs wrangler pages deploy dist --project-name octane-xplat-docs --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # The GitHub Release is the completion marker: the tag is pushed before
  # publish, so "tag exists, release missing" means an unfinished publication.
  # This job resumes it — the publisher skips the version when it did reach npm, and
  # release creation is skipped when the release already exists.
  tsrx-typegen-resume:
    name: Resume an unfinished tsrx-typegen release
    needs: gate
    runs-on: ubuntu-latest
    if: needs.gate.outputs.channel == 'ci'
    concurrency:
      group: release-tsrx-typegen
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout the tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0

      # Read the version manifest from origin/main so a newer release commit
      # resolves too; main's version is the one that may be unfinished.
      - name: Check for an unfinished release
        id: pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          git fetch origin main --tags
          node scripts/release-version.ts pending tsrx-typegen --ref origin/main \
            | tee -a "$GITHUB_OUTPUT"

      - name: Check out the tagged release
        if: steps.pending.outputs.state == 'unpublished'
        run: git checkout --detach "${{ steps.pending.outputs.tag }}"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Setup Node
        if: steps.pending.outputs.state == 'unpublished'
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Restore trusted-publisher checks
        id: trusted-publishers-cache
        if: steps.pending.outputs.state == 'unpublished'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/trusted-publishers.json
          key: trusted-publishers-${{ github.job }}-${{ hashFiles('scripts/check-trusted-publishers.ts', '.github/workflows/release.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            trusted-publishers-${{ github.job }}-${{ hashFiles('scripts/check-trusted-publishers.ts', '.github/workflows/release.yml') }}-

      - name: Verify npm trusted publishing
        if: steps.pending.outputs.state == 'unpublished'
        env:
          TRUSTED_PUBLISHERS_CACHE: ${{ runner.temp }}/trusted-publishers.json
        run: node scripts/check-trusted-publishers.ts tsrx-typegen

      - name: Save trusted-publisher checks
        if: steps.pending.outputs.state == 'unpublished'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/trusted-publishers.json
          key: ${{ steps.trusted-publishers-cache.outputs.cache-primary-key }}

      - name: Install dependencies
        if: steps.pending.outputs.state == 'unpublished'
        run: bun install --frozen-lockfile

      - name: Publish to npm
        if: steps.pending.outputs.state == 'unpublished'
        run: node scripts/publish-release.ts --package tsrx-typegen

      # The Release body links the docs changelog anchor instead of embedding
      # the full notes (GitHub caps bodies at 125 KB); a rerun skips this once
      # the release exists.
      - name: Create GitHub Release
        if: steps.pending.outputs.state == 'unpublished'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pending.outputs.version }}
          TAG: ${{ steps.pending.outputs.tag }}
        run: |
          cat > .release-notes.md <<EOF
          **tsrx-typegen $VERSION** is published to npm.

          Read the full release notes in the [changelog](https://octane-xplat.goddardai.org/changelog#$(printf '%s' "$TAG" | tr '.' '-')) or in [CHANGELOG.md](https://github.com/octane-xplat/octane-xplat/blob/$TAG/CHANGELOG.md) on the tag.
          EOF
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes-file .release-notes.md

  # tsrx-typegen ships on its own cadence — its commits never move the
  # lockstep version, and its releases don't touch the other packages. It has
  # no nightly channel; a green main run releases immediately when
  # bump-eligible commits exist under packages/tsrx-typegen/**. Runs after the
  # resume check so a failed publication finishes before a new bump is cut.
  tsrx-typegen:
    name: Publish tsrx-typegen
    needs: [gate, tsrx-typegen-resume]
    runs-on: ubuntu-latest
    if: >-
      always() &&
      needs.gate.outputs.channel == 'ci' &&
      needs.tsrx-typegen-resume.result == 'success'
    concurrency:
      group: release-tsrx-typegen
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    env:
      TESTED_SHA: ${{ needs.gate.outputs.sha }}
    steps:
      - name: Require release credential
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set RELEASE_TOKEN (fine-grained PAT: Contents, Pull requests, and Workflows read/write) for this repository; see .agents/docs/releases.md."
            exit 1
          fi

      - name: Checkout the tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TESTED_SHA }}
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # This job commits and pushes its release commit to main. An ordinary
      # commit landing after the tested revision means a newer CI run owns
      # the release — skip rather than fail or rebase generated log edits.
      - name: Sync preceding release commits
        id: sync
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$TESTED_SHA" origin/main
          intervening_authors="$(git log "$TESTED_SHA..origin/main" --format='%ae' | sort -u)"
          if [ -n "$intervening_authors" ] && [ "$intervening_authors" != "41898282+github-actions[bot]@users.noreply.github.com" ]; then
            echo "::notice::main advanced past tested revision $TESTED_SHA with non-release commits — a newer CI run will release tsrx-typegen; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The release stream prepends to the root logs. Start from the
          # previous release commit so those insertions never need a rebase.
          git merge --ff-only origin/main

      - name: Resolve release version
        id: version
        if: steps.sync.outputs.skip != 'true'
        env:
          VERSION_OVERRIDE: ${{ inputs.typegen_version || '' }}
        run: node scripts/release-version.ts tsrx-typegen >> "$GITHUB_OUTPUT"

      # Check before any version bump or publish, reusing successful checks
      # for up to 24 hours. npm still authorizes every actual publish.
      - name: Restore trusted-publisher checks
        id: trusted-publishers-cache
        if: steps.sync.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/trusted-publishers.json
          key: trusted-publishers-${{ github.job }}-${{ hashFiles('scripts/check-trusted-publishers.ts', '.github/workflows/release.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            trusted-publishers-${{ github.job }}-${{ hashFiles('scripts/check-trusted-publishers.ts', '.github/workflows/release.yml') }}-

      - name: Verify npm trusted publishing
        if: steps.sync.outputs.skip != 'true'
        env:
          TRUSTED_PUBLISHERS_CACHE: ${{ runner.temp }}/trusted-publishers.json
        run: node scripts/check-trusted-publishers.ts tsrx-typegen

      - name: Save trusted-publisher checks
        if: steps.sync.outputs.skip != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/trusted-publishers.json
          key: ${{ steps.trusted-publishers-cache.outputs.cache-primary-key }}

      - name: Install dependencies
        if: steps.sync.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Bump version
        if: steps.version.outputs.should_release == 'true'
        # Update only the independent package manifest.
        working-directory: packages/tsrx-typegen
        run: npm pkg set version="${{ steps.version.outputs.version }}"

      - name: Prepare release notes
        if: steps.version.outputs.should_release == 'true'
        run: |
          bun install --lockfile-only --ignore-scripts
          node scripts/release-notes.ts prepare tsrx-typegen "${{ steps.version.outputs.version }}"

      # Checkout persists the RELEASE_TOKEN credential, so this push (which
      # also triggers CI and release-pr on the new main commit) needs no
      # credential override.
      - name: Commit and tag release
        if: steps.version.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- bun.lock packages/tsrx-typegen/package.json CHANGELOG.md FIXLOG.md .changelog
          git commit -m "chore(release): tsrx-typegen ${{ steps.version.outputs.version }}"
          # Refuse a concurrent main update; never rebase generated log edits.
          git tag "${{ steps.version.outputs.tag }}"
          git push origin HEAD:main
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Publish to npm
        if: steps.version.outputs.should_release == 'true'
        run: node scripts/publish-release.ts --package tsrx-typegen

      # The Release body links the docs changelog anchor instead of embedding
      # the full notes prepared above (GitHub caps bodies at 125 KB).
      - name: Create GitHub Release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cat > .release-notes.md <<EOF
          **tsrx-typegen $VERSION** is published to npm.

          Read the full release notes in the [changelog](https://octane-xplat.goddardai.org/changelog#$(printf '%s' "$TAG" | tr '.' '-')) or in [CHANGELOG.md](https://github.com/octane-xplat/octane-xplat/blob/$TAG/CHANGELOG.md) on the tag.
          EOF
          gh release create "$TAG" --title "$TAG" --notes-file .release-notes.md

  # A merged release commit whose tree lacks Stable CI evidence qualifies
  # inline: the same heavy lanes run through workflow_call on the merged sha.
  qualify:
    name: Qualify the merged tree
    needs: gate
    if: >-
      needs.gate.outputs.channel == 'ci' &&
      needs.gate.outputs.lockstep_pending == 'true' &&
      needs.gate.outputs.qualified != 'true'
    concurrency:
      group: release-qualify-${{ needs.gate.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: read
    uses: ./.github/workflows/stable.yml
    with:
      sha: ${{ needs.gate.outputs.lockstep_sha }}

  # Lockstep release: every publishable package except tsrx-typegen ships at
  # the same version. The release commit already bumped versions and consumed
  # the changelog notes — this job tags the tested revision, publishes, and
  # rebuilds the release PR for the next version. Nothing commits to main.
  lockstep:
    name: Publish @octane-xplat/*
    needs: [gate, qualify]
    runs-on: ubuntu-latest
    if: >-
      always() &&
      needs.gate.outputs.channel == 'ci' &&
      needs.gate.outputs.lockstep_pending == 'true' &&
      (needs.gate.outputs.qualified == 'true' || needs.qualify.result == 'success')
    concurrency:
      group: release-lockstep
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      actions: write
    env:
      TESTED_SHA: ${{ needs.gate.outputs.lockstep_sha }}
      VERSION: ${{ needs.gate.outputs.version }}
      TAG: ${{ needs.gate.outputs.tag }}
    steps:
      - name: Require release credential
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set RELEASE_TOKEN (fine-grained PAT: Contents, Pull requests, and Workflows read/write) for this repository; see .agents/docs/releases.md."
            exit 1
          fi

      - name: Checkout the tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TESTED_SHA }}
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.RELEASE_TOKEN }}

      # Pending was checked before qualification ran. A tag pointing at a
      # different commit means another release owns it; a tag at TESTED_SHA
      # means an earlier attempt published it — continue so failed steps can
      # retry (peel annotated tags when comparing).
      - name: Confirm the release is unpublished
        id: unpublished
        run: |
          set -euo pipefail
          remote="$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          commit="$(echo "$remote" | grep '\^{}$' | awk '{print $1}' || true)"
          commit="${commit:-$(echo "$remote" | head -1 | awk '{print $1}')}"
          if [ -n "$commit" ] && [ "$commit" != "$TESTED_SHA" ]; then
            echo "::notice::$TAG already exists on origin at $commit — another release owns this tag; skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ "$commit" = "$TESTED_SHA" ]; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          fi

      # Check before publishing, reusing successful checks for up to 24 hours.
      # npm still authorizes every actual publish.
      - name: Restore trusted-publisher checks
        id: trusted-publishers-cache
        if: steps.unpublished.outputs.exists != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/trusted-publishers.json
          key: trusted-publishers-${{ github.job }}-${{ hashFiles('scripts/check-trusted-publishers.ts', '.github/workflows/release.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            trusted-publishers-${{ github.job }}-${{ hashFiles('scripts/check-trusted-publishers.ts', '.github/workflows/release.yml') }}-

      - name: Verify npm trusted publishing
        if: steps.unpublished.outputs.exists != 'true'
        env:
          TRUSTED_PUBLISHERS_CACHE: ${{ runner.temp }}/trusted-publishers.json
        run: node scripts/check-trusted-publishers.ts

      - name: Save trusted-publisher checks
        if: steps.unpublished.outputs.exists != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/trusted-publishers.json
          key: ${{ steps.trusted-publishers-cache.outputs.cache-primary-key }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Setup Node
        if: steps.unpublished.outputs.exists != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        if: steps.unpublished.outputs.exists != 'true'
        run: bun install --frozen-lockfile

      - name: Check versioned patch artifact
        if: steps.unpublished.outputs.exists != 'true'
        run: bun run turbo run pack:check --filter=@octane-xplat/patches

      - name: Tag the release
        if: >-
          steps.unpublished.outputs.exists != 'true' &&
          steps.unpublished.outputs.tagged != 'true'
        run: |
          git tag "$TAG" "$TESTED_SHA"
          git push origin "$TAG"

      # Bun creates tarballs with resolved workspace/catalog versions. npm uploads
      # them through trusted publishing and generates provenance. No static token.
      # The helper skips registry versions already published when resuming a release.
      - name: Publish to npm
        if: steps.unpublished.outputs.exists != 'true'
        run: node scripts/publish-release.ts

      # The release commit consumed the pending notes into the root logs,
      # which the docs changelog page renders — the Release body links the
      # version's anchor instead of embedding the full notes (GitHub caps
      # bodies at 125 KB). A rerun skips this once the release exists.
      - name: Create GitHub Release
        if: steps.unpublished.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > .release-notes.md <<EOF
          **Octane Xplat $VERSION** is published to npm.

          Read the full release notes in the [changelog](https://octane-xplat.goddardai.org/changelog#$(printf '%s' "$TAG" | tr '.' '-')) or in [CHANGELOG.md](https://github.com/octane-xplat/octane-xplat/blob/$TAG/CHANGELOG.md) on the tag.
          EOF
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes-file .release-notes.md

      - name: Queue the next release PR
        if: steps.unpublished.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release-pr.yml --ref main

  # The scheduled nightly resolves the newest green main CI revision, then
  # decides whether publishable files changed since the published nightly.
  nightly-gate:
    name: Resolve nightly release
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.track == 'nightly')) &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'octane-xplat/octane-xplat'
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.ci.outputs.sha }}
      publish: ${{ steps.decision.outputs.publish }}
      version: ${{ steps.decision.outputs.version }}
    steps:
      - name: Find the newest green main CI run
        id: ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1"
          id="$(gh api "$runs" --jq '.workflow_runs[0].id // empty')"
          sha="$(gh api "$runs" --jq '.workflow_runs[0].head_sha // empty')"
          if [ -z "$id" ] || [ -z "$sha" ]; then
            echo "::error::no successful push CI run on main — cannot decide a nightly"
            exit 1
          fi
          echo "newest green main CI run: $id at $sha"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          # Bun owns the dependency cache; disable setup-node's automatic caching.
          package-manager-cache: false

      - name: Verify CI release evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node scripts/verify-release-evidence.ts verify --track ci
          --sha "${{ steps.ci.outputs.sha }}" --run-id "${{ steps.ci.outputs.id }}"

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Decide whether to publish a nightly
        id: decision
        run: |
          set -o pipefail
          node scripts/release-nightly.ts "${{ steps.ci.outputs.sha }}" | tee -a "$GITHUB_OUTPUT"

  # Nightly channel: one prerelease per day when publishable files changed.
  # Nothing commits to main and the `latest` dist-tag is untouched. This job
  # alone owns the moving `nightly` git tag and GitHub prerelease.
  nightly:
    name: Publish nightly
    needs: nightly-gate
    runs-on: ubuntu-latest
    if: needs.nightly-gate.outputs.publish == 'true'
    concurrency:
      group: release-nightly
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    env:
      TESTED_SHA: ${{ needs.nightly-gate.outputs.sha }}
      VERSION: ${{ needs.nightly-gate.outputs.version }}
    steps:
      - name: Require release credential
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set RELEASE_TOKEN (fine-grained PAT: Contents, Pull requests, and Workflows read/write) for this repository; see .agents/docs/releases.md."
            exit 1
          fi

      - name: Checkout the tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TESTED_SHA }}
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # Check before any version bumps or publishes, reusing successful checks
      # for up to 24 hours. npm still authorizes every actual publish.
      - name: Restore trusted-publisher checks
        id: trusted-publishers-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/trusted-publishers.json
          key: trusted-publishers-${{ github.job }}-${{ hashFiles('scripts/check-trusted-publishers.ts', '.github/workflows/release.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            trusted-publishers-${{ github.job }}-${{ hashFiles('scripts/check-trusted-publishers.ts', '.github/workflows/release.yml') }}-

      - name: Verify npm trusted publishing
        env:
          TRUSTED_PUBLISHERS_CACHE: ${{ runner.temp }}/trusted-publishers.json
        run: node scripts/check-trusted-publishers.ts

      - name: Save trusted-publisher checks
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/trusted-publishers.json
          key: ${{ steps.trusted-publishers-cache.outputs.cache-primary-key }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `g<sha>` keeps the prerelease identifier alphanumeric — a bare sha
      # prefix can be all digits with a leading zero, which is invalid semver.
      - name: Bump lockstep versions (nightly)
        run: |
          node scripts/bump-versions.ts "$VERSION"
          bun install --lockfile-only --ignore-scripts

      - name: Check nightly patch artifact
        run: bun run turbo run pack:check --filter=@octane-xplat/patches

      - name: Publish nightly to npm
        run: node scripts/publish-release.ts --tag nightly

      # Checkout persists the RELEASE_TOKEN credential — retagging a workflow
      # change requires Workflows: write, which GITHUB_TOKEN cannot hold.
      - name: Move the nightly tag and prerelease
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          git tag -f nightly "$TESTED_SHA"
          git push --force origin refs/tags/nightly
          gh release delete nightly --yes 2>/dev/null || true
          gh release create nightly --title nightly --prerelease \
            --notes "Nightly prerelease of ${TESTED_SHA} — install with \`bun add @octane-xplat/<pkg>@nightly\` (published as $VERSION)."
