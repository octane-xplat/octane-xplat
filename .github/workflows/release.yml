name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Lockstep version override, e.g. 0.7.0 (blank = git-cliff inference)
        required: false
        type: string
      typegen_version:
        description: tsrx-typegen version override (blank = git-cliff inference)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

# git-cliff path filters for the lockstep track: only shipped packages count
# for bump inference and changelog entries. Harness, fixtures, and
# tsrx-typegen (own cadence) are excluded.
env:
  LOCKSTEP_PATHS: >-
    --include-path 'packages/**'
    --exclude-path 'packages/app/**'
    --exclude-path 'packages/demos/**'
    --exclude-path 'packages/media-probe/**'
    --exclude-path 'packages/typegen-fixture/**'
    --exclude-path 'packages/tsrx-typegen/**'

jobs:
  # Single gate consumed by every downstream job: reads the CI run's recorded
  # evidence for the tested sha and resolves the release channel — 'stable'
  # when every required job is green, 'nightly' when checks passed but a
  # native lane did not, 'none' when checks failed. A red native lane thus
  # degrades to the prerelease channel instead of holding the release.
  gate:
    name: Resolve release channel
    runs-on: ubuntu-latest
    # Cancelled CI runs are superseded pushes — skip them; the newer run
    # produces its own release.
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion != 'cancelled' &&
        github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main')
    permissions:
      contents: read
      actions: read
    outputs:
      channel: ${{ steps.evidence.outputs.channel }}
    # The revision CI actually tested — publish must consume evidence for
    # this sha and build the tested code, not whatever main has moved to.
    env:
      TESTED_SHA: >-
        ${{ github.event_name == 'workflow_run' &&
            github.event.workflow_run.head_sha ||
            github.sha }}
      CI_RUN_ID: ${{ github.event.workflow_run.id || '' }}
    steps:
      - name: Checkout the tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TESTED_SHA }}

      - name: Verify CI release evidence
        id: evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-release-evidence.mjs verify --sha "$TESTED_SHA" ${CI_RUN_ID:+--run-id "$CI_RUN_ID"}

  # Lockstep release: every publishable package except tsrx-typegen ships at
  # the same version. Runs after tsrx-typegen because both jobs commit and
  # push to main — serializing avoids the non-fast-forward race.
  packages:
    name: Publish @octane-xplat/*
    needs: [gate, tsrx-typegen]
    runs-on: ubuntu-latest
    # always() so a failed typegen run doesn't hold the lockstep release
    # hostage — the rebase-before-push handles ordering regardless.
    if: >-
      always() &&
      (needs.gate.outputs.channel == 'stable' ||
        needs.gate.outputs.channel == 'nightly')
    permissions:
      contents: write
      id-token: write
    env:
      TESTED_SHA: >-
        ${{ github.event_name == 'workflow_run' &&
            github.event.workflow_run.head_sha ||
            github.sha }}
      CI_RUN_ID: ${{ github.event.workflow_run.id || '' }}
    steps:
      - name: Checkout the tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TESTED_SHA }}
          fetch-depth: 0
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install git-cliff
        if: needs.gate.outputs.channel == 'stable'
        uses: taiki-e/install-action@git-cliff

      - name: Resolve release version
        id: version
        if: needs.gate.outputs.channel == 'stable'
        env:
          VERSION_OVERRIDE: ${{ github.event.inputs.version || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$VERSION_OVERRIDE" ]; then
            next_version="${VERSION_OVERRIDE#v}"
            node -e "process.exit(/^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$/.test(process.argv[1]) ? 0 : 1)" "$next_version" || {
              echo "Invalid version override: $VERSION_OVERRIDE" >&2; exit 1; }
            echo "Using explicit version override: $next_version"
          else
            next_version="$(eval "git-cliff --bumped-version $LOCKSTEP_PATHS" | sed 's/^v//')"
          fi
          [ -n "$next_version" ] || { echo "git-cliff did not infer a version" >&2; exit 1; }

          if git rev-parse --verify --quiet "refs/tags/v$next_version" >/dev/null; then
            echo "Tag v$next_version already exists — nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$next_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$next_version" >> "$GITHUB_OUTPUT"

      # Check before any version bumps or publishes, reusing successful checks
      # for up to 24 hours. npm still authorizes every actual publish.
      # Runs for either channel — nightly publishes need the same guarantee.
      - name: Restore trusted-publisher checks
        id: trusted-publishers-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/trusted-publishers.json
          key: trusted-publishers-${{ github.job }}-${{ hashFiles('scripts/check-trusted-publishers.mjs', '.github/workflows/release.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            trusted-publishers-${{ github.job }}-${{ hashFiles('scripts/check-trusted-publishers.mjs', '.github/workflows/release.yml') }}-

      - name: Verify npm trusted publishing
        env:
          TRUSTED_PUBLISHERS_CACHE: ${{ runner.temp }}/trusted-publishers.json
        run: node scripts/check-trusted-publishers.mjs

      - name: Save trusted-publisher checks
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/trusted-publishers.json
          key: ${{ steps.trusted-publishers-cache.outputs.cache-primary-key }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump lockstep versions
        if: steps.version.outputs.should_release == 'true'
        run: node scripts/bump-versions.mjs "${{ steps.version.outputs.version }}"

      - name: Generate changelog
        id: changelog
        if: steps.version.outputs.should_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          eval "git-cliff --unreleased --tag ${{ steps.version.outputs.tag }} $LOCKSTEP_PATHS --strip all -o .release-notes.md"
          node - <<'EOF'
          const fs = require('fs')
          const notes = fs.readFileSync('.release-notes.md', 'utf8').trim()
          const file = 'CHANGELOG.md'
          const lines = fs.readFileSync(file, 'utf8').split('\n')
          const insertAt = lines.findIndex((l) => l.startsWith('## '))
          lines.splice(insertAt === -1 ? lines.length : insertAt, 0, notes, '')
          fs.writeFileSync(file, lines.join('\n'))
          EOF

      - name: Commit and tag release
        if: steps.version.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            'packages/*/package.json' \
            packages/create/template/package.json \
            packages/create/library-template/package.json \
            packages/create/template/pnpm-workspace.yaml \
            CHANGELOG.md
          git commit -m "chore(release): align packages at ${{ steps.version.outputs.version }}"
          # Publishing consumes the tested revision only. If main moved past
          # it, every intervening commit must be a release-bot commit (e.g.
          # the tsrx-typegen job that ran before this one) — a normal push
          # would ship untested code, so abort instead of rebasing over it.
          git fetch origin main
          intervening_authors="$(git log "$TESTED_SHA..origin/main" --format='%ae' | sort -u)"
          if [ -n "$intervening_authors" ] && [ "$intervening_authors" != "41898282+github-actions[bot]@users.noreply.github.com" ]; then
            echo "main advanced past tested revision $TESTED_SHA with non-release commits — rerun release after CI on the new HEAD" >&2
            exit 1
          fi
          git pull --rebase origin main
          git tag "${{ steps.version.outputs.tag }}"
          git push origin HEAD:main
          git push origin "${{ steps.version.outputs.tag }}"

      # pnpm publish (not npm): publishConfig export remapping and workspace:*
      # rewriting are pnpm behaviors. No NODE_AUTH_TOKEN/NPM_TOKEN is set —
      # pnpm mints per-package tokens from the OIDC id token via npm's trusted
      # publishing exchange and attaches provenance automatically.
      - name: Publish to npm
        if: steps.version.outputs.should_release == 'true'
        run: pnpm -r --filter '!tsrx-typegen' publish --access public --no-git-checks --provenance

      - name: Create GitHub Release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.version.outputs.tag }}" --title "${{ steps.version.outputs.tag }}" --notes-file .release-notes.md

      # Nightly channel: every checks-green revision publishes a prerelease,
      # including fully-green pushes, so `@nightly` always tracks the newest
      # CI-tested main. Nothing commits to main and the `latest` dist-tag is
      # untouched. This job alone owns the moving `nightly` git tag and
      # GitHub prerelease so parallel jobs can't race them.
      - name: Resolve nightly version
        id: nightly
        # `g<sha>` keeps the prerelease identifier alphanumeric — a bare sha
        # prefix can be all digits with a leading zero, which is invalid semver.
        run: echo "version=0.0.0-nightly.g${TESTED_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Bump lockstep versions (nightly)
        run: node scripts/bump-versions.mjs "${{ steps.nightly.outputs.version }}"

      - name: Publish nightly to npm
        run: pnpm -r --filter '!tsrx-typegen' publish --access public --no-git-checks --provenance --tag nightly

      - name: Move the nightly tag and prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git tag -f nightly "$TESTED_SHA"
          git push --force origin refs/tags/nightly
          gh release delete nightly --yes 2>/dev/null || true
          gh release create nightly --title nightly --prerelease \
            --notes "Nightly prerelease of ${TESTED_SHA} — install with \`pnpm add @octane-xplat/<pkg>@nightly\` (published as ${{ steps.nightly.outputs.version }})."

  # tsrx-typegen ships on its own cadence — its commits never move the
  # lockstep version, and its releases don't touch the other packages.
  tsrx-typegen:
    name: Publish tsrx-typegen
    needs: gate
    runs-on: ubuntu-latest
    if: >-
      needs.gate.outputs.channel == 'stable' ||
      needs.gate.outputs.channel == 'nightly'
    permissions:
      contents: write
      id-token: write
    env:
      TESTED_SHA: >-
        ${{ github.event_name == 'workflow_run' &&
            github.event.workflow_run.head_sha ||
            github.sha }}
      CI_RUN_ID: ${{ github.event.workflow_run.id || '' }}
    steps:
      - name: Checkout the tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TESTED_SHA }}
          fetch-depth: 0
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install git-cliff
        if: needs.gate.outputs.channel == 'stable'
        uses: taiki-e/install-action@git-cliff

      - name: Resolve release version
        id: version
        if: needs.gate.outputs.channel == 'stable'
        env:
          VERSION_OVERRIDE: ${{ github.event.inputs.typegen_version || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$VERSION_OVERRIDE" ]; then
            next_version="${VERSION_OVERRIDE#v}"
            node -e "process.exit(/^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$/.test(process.argv[1]) ? 0 : 1)" "$next_version" || {
              echo "Invalid version override: $VERSION_OVERRIDE" >&2; exit 1; }
            echo "Using explicit version override: $next_version"
          else
            next_version="$(git-cliff --config cliff.tsrx-typegen.toml --bumped-version \
              --include-path 'packages/tsrx-typegen/**' | sed 's/^tsrx-typegen-v//;s/^v//')"
          fi
          [ -n "$next_version" ] || { echo "git-cliff did not infer a version" >&2; exit 1; }

          if git rev-parse --verify --quiet "refs/tags/tsrx-typegen-v$next_version" >/dev/null; then
            echo "Tag tsrx-typegen-v$next_version already exists — nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$next_version" >> "$GITHUB_OUTPUT"
          echo "tag=tsrx-typegen-v$next_version" >> "$GITHUB_OUTPUT"

      - name: Restore trusted-publisher checks
        id: trusted-publishers-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/trusted-publishers.json
          key: trusted-publishers-${{ github.job }}-${{ hashFiles('scripts/check-trusted-publishers.mjs', '.github/workflows/release.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            trusted-publishers-${{ github.job }}-${{ hashFiles('scripts/check-trusted-publishers.mjs', '.github/workflows/release.yml') }}-

      - name: Verify npm trusted publishing
        env:
          TRUSTED_PUBLISHERS_CACHE: ${{ runner.temp }}/trusted-publishers.json
        run: node scripts/check-trusted-publishers.mjs tsrx-typegen

      - name: Save trusted-publisher checks
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/trusted-publishers.json
          key: ${{ steps.trusted-publishers-cache.outputs.cache-primary-key }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump version
        if: steps.version.outputs.should_release == 'true'
        # npm --workspace requires npm workspaces; this is a pnpm workspace, so
        # run inside the package dir instead.
        working-directory: packages/tsrx-typegen
        run: npm pkg set version="${{ steps.version.outputs.version }}"

      - name: Generate changelog
        if: steps.version.outputs.should_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git-cliff --config cliff.tsrx-typegen.toml --unreleased \
            --include-path 'packages/tsrx-typegen/**' \
            --tag "${{ steps.version.outputs.tag }}" \
            --strip all -o .release-notes.md
          touch packages/tsrx-typegen/CHANGELOG.md
          node - <<'EOF'
          const fs = require('fs')
          const notes = fs.readFileSync('.release-notes.md', 'utf8').trim()
          const file = 'packages/tsrx-typegen/CHANGELOG.md'
          const existing = fs.readFileSync(file, 'utf8')
          const body = existing.startsWith('# Changelog')
            ? existing.replace(/^# Changelog\n/, `# Changelog\n\n${notes}\n\n`)
            : `# Changelog\n\n${notes}\n\n${existing}`
          fs.writeFileSync(file, body)
          EOF

      - name: Commit and tag release
        if: steps.version.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/tsrx-typegen/package.json packages/tsrx-typegen/CHANGELOG.md
          git commit -m "chore(release): tsrx-typegen ${{ steps.version.outputs.version }}"
          # Same tested-revision guard as the lockstep job: refuse to rebase
          # over a main that advanced with anything but release-bot commits.
          git fetch origin main
          intervening_authors="$(git log "$TESTED_SHA..origin/main" --format='%ae' | sort -u)"
          if [ -n "$intervening_authors" ] && [ "$intervening_authors" != "41898282+github-actions[bot]@users.noreply.github.com" ]; then
            echo "main advanced past tested revision $TESTED_SHA with non-release commits — rerun release after CI on the new HEAD" >&2
            exit 1
          fi
          git pull --rebase origin main
          git tag "${{ steps.version.outputs.tag }}"
          git push origin HEAD:main
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Publish to npm
        if: steps.version.outputs.should_release == 'true'
        run: pnpm --filter tsrx-typegen publish --access public --no-git-checks --provenance

      - name: Create GitHub Release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.version.outputs.tag }}" --title "${{ steps.version.outputs.tag }}" --notes-file .release-notes.md

      # Nightly channel — npm publish only; the packages job owns the moving
      # `nightly` git tag and GitHub prerelease.
      - name: Bump version (nightly)
        working-directory: packages/tsrx-typegen
        run: npm pkg set version="0.0.0-nightly.g${TESTED_SHA:0:7}"

      - name: Publish nightly to npm
        run: pnpm --filter tsrx-typegen publish --access public --no-git-checks --provenance --tag nightly

  # Docs ship continuously: every checks-green CI run on main deploys the docs
  # site — a red native lane degrades the release to nightly, not the docs.
  docs:
    name: Deploy docs
    needs: gate
    runs-on: ubuntu-latest
    if: >-
      needs.gate.outputs.channel == 'stable' ||
      needs.gate.outputs.channel == 'nightly'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs site
        run: pnpm --filter @xplat/docs build

      - name: Deploy to Cloudflare Pages
        run: pnpm --filter @xplat/docs exec wrangler pages deploy dist --project-name octane-xplat-docs --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
