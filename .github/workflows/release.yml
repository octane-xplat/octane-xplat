name: Release

on:
  workflow_run:
    workflows:
      - CI
      - Stable CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      track:
        description: Release qualification to require
        type: choice
        options: [stable, nightly]
        default: stable
      version:
        description: Lockstep version override, e.g. 0.7.0 (blank = Conventional Commit inference)
        required: false
        type: string
      typegen_version:
        description: tsrx-typegen version override (blank = Conventional Commit inference)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Stable completion must not replace a newer pending nightly, and failed CI
  # notifications must not displace any qualified publication.
  group: >-
    release-${{ github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion != 'success' && github.run_id ||
      (github.event_name == 'workflow_run' &&
        (github.event.workflow_run.name == 'CI' && 'nightly' || 'stable') ||
        inputs.track || 'stable') }}
  cancel-in-progress: false

jobs:
  # Fast CI completion publishes nightly; Stable CI completion publishes stable.
  # Each event consumes its own evidence for the exact tested SHA. Publishing
  # stays in this file so npm's trusted-publisher workflow binding stays valid.
  gate:
    name: Resolve release channel
    runs-on: ubuntu-latest
    # Cancelled CI runs are superseded pushes — skip them; the newer run
    # produces its own release.
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main')
    permissions:
      contents: read
      actions: read
    outputs:
      channel: ${{ steps.evidence.outputs.channel }}
      sha: ${{ steps.evidence.outputs.sha }}
    # The revision CI actually tested — publish must consume evidence for
    # this sha and build the tested code, not whatever main has moved to.
    env:
      TESTED_SHA: >-
        ${{ github.event_name == 'workflow_run' &&
            github.event.workflow_run.head_sha ||
            github.sha }}
      CI_RUN_ID: ${{ github.event.workflow_run.id || '' }}
      RELEASE_TRACK: >-
        ${{ github.event_name == 'workflow_run' &&
            (github.event.workflow_run.name == 'CI' && 'nightly' || 'stable') ||
            inputs.track || 'stable' }}
    steps:
      - name: Require nightly tag credential
        if: env.RELEASE_TRACK == 'nightly'
        env:
          GH_TOKEN: ${{ secrets.NIGHTLY_RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set NIGHTLY_RELEASE_TOKEN with Contents: write and Workflows: write for this repository; see .agents/docs/releases.md."
            exit 1
          fi

      - name: Checkout the tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TESTED_SHA }}

      - name: Verify CI release evidence
        id: evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$RELEASE_TRACK" = stable ] && [ -n "$CI_RUN_ID" ]; then
            # Stable CI records its triggering push SHA, which can differ from
            # workflow_run's default-branch head_sha when main advances.
            node scripts/verify-release-evidence.ts verify --track stable --run-id "$CI_RUN_ID"
          else
            node scripts/verify-release-evidence.ts verify --track "$RELEASE_TRACK" \
              --sha "$TESTED_SHA" ${CI_RUN_ID:+--run-id "$CI_RUN_ID"}
          fi

  # Lockstep release: every publishable package except tsrx-typegen ships at
  # the same version. Runs after tsrx-typegen because both jobs commit and
  # push to main — serializing avoids the non-fast-forward race.
  packages:
    name: Publish @octane-xplat/*
    needs: [gate, tsrx-typegen]
    runs-on: ubuntu-latest
    # always() so a failed typegen run doesn't hold the lockstep release
    # hostage. Stable jobs sync preceding release commits before editing the logs.
    if: >-
      always() &&
      (needs.gate.outputs.channel == 'stable' ||
        needs.gate.outputs.channel == 'nightly')
    permissions:
      contents: write
      id-token: write
    env:
      TESTED_SHA: ${{ needs.gate.outputs.sha }}
    steps:
      - name: Checkout the tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TESTED_SHA }}
          fetch-depth: 0
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Sync preceding release commits
        if: needs.gate.outputs.channel == 'stable'
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$TESTED_SHA" origin/main
          intervening_authors="$(git log "$TESTED_SHA..origin/main" --format='%ae' | sort -u)"
          if [ -n "$intervening_authors" ] && [ "$intervening_authors" != "41898282+github-actions[bot]@users.noreply.github.com" ]; then
            echo "main advanced past tested revision $TESTED_SHA with non-release commits — rerun release after CI on the new HEAD" >&2
            exit 1
          fi
          # Both streams prepend to the root logs. Start from the previous
          # release commit so those insertions never need a content rebase.
          git merge --ff-only origin/main

      - name: Resolve release version
        id: version
        if: needs.gate.outputs.channel == 'stable'
        env:
          VERSION_OVERRIDE: ${{ github.event.inputs.version || '' }}
        run: node scripts/release-version.ts lockstep >> "$GITHUB_OUTPUT"

      # Check before any version bumps or publishes, reusing successful checks
      # for up to 24 hours. npm still authorizes every actual publish.
      # Runs for either channel — nightly publishes need the same guarantee.
      - name: Restore trusted-publisher checks
        id: trusted-publishers-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/trusted-publishers.json
          key: trusted-publishers-${{ github.job }}-${{ hashFiles('scripts/check-trusted-publishers.ts', '.github/workflows/release.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            trusted-publishers-${{ github.job }}-${{ hashFiles('scripts/check-trusted-publishers.ts', '.github/workflows/release.yml') }}-

      - name: Verify npm trusted publishing
        env:
          TRUSTED_PUBLISHERS_CACHE: ${{ runner.temp }}/trusted-publishers.json
        run: node scripts/check-trusted-publishers.ts

      - name: Save trusted-publisher checks
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/trusted-publishers.json
          key: ${{ steps.trusted-publishers-cache.outputs.cache-primary-key }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump lockstep versions
        if: steps.version.outputs.should_release == 'true'
        run: node scripts/bump-versions.ts "${{ steps.version.outputs.version }}"

      - name: Prepare release notes
        if: steps.version.outputs.should_release == 'true'
        run: node scripts/release-notes.ts prepare lockstep "${{ steps.version.outputs.version }}"

      - name: Commit and tag release
        if: steps.version.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            'packages/*/package.json' \
            packages/create/compatibility.json \
            packages/create/template/package.json \
            packages/create/library-template/package.json \
            packages/create/template/pnpm-workspace.yaml \
            packages/create/library-template/pnpm-workspace.yaml \
            CHANGELOG.md FIXLOG.md .changelog
          git commit -m "chore(release): align packages at ${{ steps.version.outputs.version }}"
          # Refuse a concurrent main update; never rebase generated log edits.
          git tag "${{ steps.version.outputs.tag }}"
          git push origin HEAD:main
          git push origin "${{ steps.version.outputs.tag }}"

      # pnpm publish (not npm): publishConfig export remapping and workspace:*
      # rewriting are pnpm behaviors. No NODE_AUTH_TOKEN/NPM_TOKEN is set —
      # pnpm mints per-package tokens from the OIDC id token via npm's trusted
      # publishing exchange and attaches provenance automatically.
      - name: Publish to npm
        if: steps.version.outputs.should_release == 'true'
        run: pnpm -r --filter '!tsrx-typegen' publish --access public --no-git-checks --provenance

      - name: Create GitHub Release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.version.outputs.tag }}" --title "${{ steps.version.outputs.tag }}" --notes-file .release-notes.md

      # Nightly channel: every checks-green revision publishes a prerelease,
      # including fully-green pushes, so `@nightly` always tracks the newest
      # CI-tested main. Nothing commits to main and the `latest` dist-tag is
      # untouched. This job alone owns the moving `nightly` git tag and
      # GitHub prerelease so parallel jobs can't race them.
      - name: Resolve nightly version
        id: nightly
        if: needs.gate.outputs.channel == 'nightly'
        # `g<sha>` keeps the prerelease identifier alphanumeric — a bare sha
        # prefix can be all digits with a leading zero, which is invalid semver.
        run: echo "version=0.0.0-nightly.g${TESTED_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Bump lockstep versions (nightly)
        if: needs.gate.outputs.channel == 'nightly'
        run: node scripts/bump-versions.ts "${{ steps.nightly.outputs.version }}"

      - name: Publish nightly to npm
        if: needs.gate.outputs.channel == 'nightly'
        run: pnpm -r --filter '!tsrx-typegen' publish --access public --no-git-checks --provenance --tag nightly

      - name: Move the nightly tag and prerelease
        if: needs.gate.outputs.channel == 'nightly'
        env:
          GH_TOKEN: ${{ secrets.NIGHTLY_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          git tag -f nightly "$TESTED_SHA"
          # Bypass checkout's GITHUB_TOKEN header and credential helper for
          # this push: tagging workflow changes requires Workflows: write.
          git -c http.https://github.com/.extraheader= \
            -c credential.helper= \
            -c 'credential.helper=!gh auth git-credential' \
            push --force origin refs/tags/nightly
          gh release delete nightly --yes 2>/dev/null || true
          gh release create nightly --title nightly --prerelease \
            --notes "Nightly prerelease of ${TESTED_SHA} — install with \`pnpm add @octane-xplat/<pkg>@nightly\` (published as ${{ steps.nightly.outputs.version }})."

  # tsrx-typegen ships on its own cadence — its commits never move the
  # lockstep version, and its releases don't touch the other packages.
  tsrx-typegen:
    name: Publish tsrx-typegen
    needs: gate
    runs-on: ubuntu-latest
    if: >-
      needs.gate.outputs.channel == 'stable' ||
      needs.gate.outputs.channel == 'nightly'
    permissions:
      contents: write
      id-token: write
    env:
      TESTED_SHA: ${{ needs.gate.outputs.sha }}
    steps:
      - name: Checkout the tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TESTED_SHA }}
          fetch-depth: 0
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Sync preceding release commits
        if: needs.gate.outputs.channel == 'stable'
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$TESTED_SHA" origin/main
          intervening_authors="$(git log "$TESTED_SHA..origin/main" --format='%ae' | sort -u)"
          if [ -n "$intervening_authors" ] && [ "$intervening_authors" != "41898282+github-actions[bot]@users.noreply.github.com" ]; then
            echo "main advanced past tested revision $TESTED_SHA with non-release commits — rerun release after CI on the new HEAD" >&2
            exit 1
          fi
          # Both streams prepend to the root logs. Start from the previous
          # release commit so those insertions never need a content rebase.
          git merge --ff-only origin/main

      - name: Resolve release version
        id: version
        if: needs.gate.outputs.channel == 'stable'
        env:
          VERSION_OVERRIDE: ${{ github.event.inputs.typegen_version || '' }}
        run: node scripts/release-version.ts tsrx-typegen >> "$GITHUB_OUTPUT"

      - name: Restore trusted-publisher checks
        id: trusted-publishers-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/trusted-publishers.json
          key: trusted-publishers-${{ github.job }}-${{ hashFiles('scripts/check-trusted-publishers.ts', '.github/workflows/release.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            trusted-publishers-${{ github.job }}-${{ hashFiles('scripts/check-trusted-publishers.ts', '.github/workflows/release.yml') }}-

      - name: Verify npm trusted publishing
        env:
          TRUSTED_PUBLISHERS_CACHE: ${{ runner.temp }}/trusted-publishers.json
        run: node scripts/check-trusted-publishers.ts tsrx-typegen

      - name: Save trusted-publisher checks
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/trusted-publishers.json
          key: ${{ steps.trusted-publishers-cache.outputs.cache-primary-key }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump version
        if: steps.version.outputs.should_release == 'true'
        # npm --workspace requires npm workspaces; this is a pnpm workspace, so
        # run inside the package dir instead.
        working-directory: packages/tsrx-typegen
        run: npm pkg set version="${{ steps.version.outputs.version }}"

      - name: Prepare release notes
        if: steps.version.outputs.should_release == 'true'
        run: node scripts/release-notes.ts prepare tsrx-typegen "${{ steps.version.outputs.version }}"

      - name: Commit and tag release
        if: steps.version.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- packages/tsrx-typegen/package.json CHANGELOG.md FIXLOG.md .changelog
          git commit -m "chore(release): tsrx-typegen ${{ steps.version.outputs.version }}"
          # Refuse a concurrent main update; never rebase generated log edits.
          git tag "${{ steps.version.outputs.tag }}"
          git push origin HEAD:main
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Publish to npm
        if: steps.version.outputs.should_release == 'true'
        run: pnpm --filter tsrx-typegen publish --access public --no-git-checks --provenance

      - name: Create GitHub Release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.version.outputs.tag }}" --title "${{ steps.version.outputs.tag }}" --notes-file .release-notes.md

      # Nightly channel — npm publish only; the packages job owns the moving
      # `nightly` git tag and GitHub prerelease.
      - name: Bump version (nightly)
        if: needs.gate.outputs.channel == 'nightly'
        working-directory: packages/tsrx-typegen
        run: npm pkg set version="0.0.0-nightly.g${TESTED_SHA:0:7}"

      - name: Publish nightly to npm
        if: needs.gate.outputs.channel == 'nightly'
        run: pnpm --filter tsrx-typegen publish --access public --no-git-checks --provenance --tag nightly

  # Docs deploy once per nightly-ready revision, independently of stable lanes.
  docs:
    name: Deploy docs
    needs: gate
    runs-on: ubuntu-latest
    if: needs.gate.outputs.channel == 'nightly'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.sha }}
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # turbo so the declared workspace dep graph builds first — the docs
      # vite config imports @octane-xplat/cli/vite, which resolves to dist/.
      - name: Build docs site
        run: pnpm exec turbo run build --filter=@xplat/docs

      - name: Deploy to Cloudflare Pages
        run: pnpm --filter @xplat/docs exec wrangler pages deploy dist --project-name octane-xplat-docs --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
