name: Stable CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_call:
    inputs:
      sha:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # The release PR qualifies only its newest head; called runs qualify the
  # exact sha release.yml verified.
  group: >-
    ${{ github.event_name == 'pull_request' &&
      format('stable-ci-pr-{0}', github.event.pull_request.number) ||
      format('stable-ci-{0}', inputs.sha) }}
  cancel-in-progress: true

env:
  # Pull requests test their head commit — not the merge ref — so evidence can
  # bind to the exact tree a later merge publishes.
  TESTED_SHA: ${{ inputs.sha || github.event.pull_request.head.sha }}

jobs:
  # Heavy lanes exist to qualify the bot-maintained release PR. On ordinary
  # pull requests every job is skipped; under workflow_call the caller's
  # event name is not pull_request, so the lanes run unconditionally.
  stable-checks:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.ref == 'release/lockstep' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        !github.event.pull_request.draft)
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TESTED_SHA }}
          submodules: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run build:packages
      # Workshop's Playwright journey remains local; no browser installation.
      - name: Check declared non-browser packed consumer suites
        run: bun run turbo run test:packed --filter='./packages/*' --filter='!@octane-xplat/workshop' --concurrency=2
      - name: Verify complete packed app and library starter workflows
        run: bun run check:consumer --no-build

  # Device qualification runs inside the per-target advisory lock so parallel
  # worktree/device sessions on shared hosts serialize instead of fighting
  # the same simulator.
  native-ios:
    runs-on: macos-latest
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.ref == 'release/lockstep' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        !github.event.pull_request.draft)
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TESTED_SHA }}
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Produces a simulator-debug .app from the packed artifacts and proves
      # it installs + launches on a booted iPhone sim (simctl install/launch
      # on an already-booted device — ns run ios reboots and fails).
      - name: Prepare and validate packed consumer packages
        run: |
          bun run build:packages
          bun run check:pack

      - name: Packed consumer iOS build + simulator smoke
        run: node scripts/with-target-lock.ts ios -- node scripts/verify-consumer.ts --no-build --native ios --smoke-ios

  # Framework regression lane: the apps/mobile on-device Vitest suite runs in
  # the real NS runtime on a simulator. `ns test` builds the unitTesting
  # bundle and drives `ns run` inside the per-target advisory lock.
  native-ios-tests:
    runs-on: macos-latest
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.ref == 'release/lockstep' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        !github.event.pull_request.draft)
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TESTED_SHA }}
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # apps/mobile's vite config imports @octane-xplat/cli/vite, which resolves
      # to cli's dist — build the package closure before ns test runs vite.
      - run: bun run build:packages

      # Hosted runners still ship Simulator.app, but pinning an explicit
      # booted device keeps the lane identical to Xcode 27 dev hosts (which
      # can only target already-booted simulators).
      - name: Boot an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devs=json.load(sys.stdin)["devices"]; print(next(d["udid"] for rt in devs.values() for d in rt if d["isAvailable"] and "iPhone" in d["name"]))')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Generate app routes for the bundle
        run: bun run gen:app

      # The unitTesting bundle's vite build exceeds Node's default 2GB heap
      # (OOM before emit → the .app has no bundle.js and the worker never
      # connects). macos runners have ~14GB; give the build headroom.
      - name: On-device Vitest suite (apps/mobile)
        run: node scripts/with-target-lock.ts ios -- bun run turbo run test:ios --filter=@xplat/mobile --env-mode=loose -- --device "$SIM_UDID"
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'

  native-android:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.ref == 'release/lockstep' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        !github.event.pull_request.draft)
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TESTED_SHA }}
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Produces a debug .apk from the packed artifacts. Debug-signed artifact
      # — this is a build check, not Play-store distribution evidence. No
      # emulator runtime smoke yet (documented gap).
      - name: Prepare and validate packed consumer packages
        run: |
          bun run build:packages
          bun run check:pack

      - name: Packed consumer Android build
        run: node scripts/with-target-lock.ts android -- node scripts/verify-consumer.ts --no-build --native android
        env:
          # ns gates `build` on its doctor check, which requires a working
          # `emulator` binary — unused by a build-only lane and absent/broken
          # on hosted ubuntu runners. The gradle build itself is the gate.
          NS_SKIP_ENV_CHECK: 'true'

  # Evidence records the tested sha and its tree: a merge commit has a new sha
  # but an identical tree, so tree-keyed artifacts let a clean merge publish
  # without re-running these lanes. Recorded on the pull request only —
  # called runs qualify the release in place and record nothing.
  evidence:
    runs-on: ubuntu-latest
    needs: [stable-checks, native-ios, native-ios-tests, native-android]
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'release/lockstep' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TESTED_SHA }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # No pnpm in this job — disable v5's auto package-manager cache,
          # which would otherwise invoke pnpm for the detected lockfile.
          package-manager-cache: false
      - name: Record stable qualification
        id: evidence
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          tree="$(git rev-parse "$TESTED_SHA^{tree}")"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          node scripts/verify-release-evidence.ts record --track stable \
            --jobs "$JOB_RESULTS" --sha "$TESTED_SHA" --tree "$tree" \
            --run-id "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v6
        with:
          name: ci-evidence-stable-${{ steps.evidence.outputs.tree }}
          path: .ci-evidence/ci-evidence.json
          if-no-files-found: error
          retention-days: 90
