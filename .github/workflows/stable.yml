name: Stable CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_call:
    inputs:
      sha:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # The release PR qualifies only its newest head; called runs qualify the
  # exact sha release.yml verified.
  group: >-
    ${{ github.event_name == 'pull_request' &&
      format('stable-ci-pr-{0}', github.event.pull_request.number) ||
      format('stable-ci-{0}', inputs.sha) }}
  cancel-in-progress: true

env:
  # Pull requests test their head commit — not the merge ref — so evidence can
  # bind to the exact tree a later merge publishes.
  TESTED_SHA: ${{ inputs.sha || github.event.pull_request.head.sha }}

jobs:
  # Heavy lanes exist to qualify the bot-maintained release PR. On ordinary
  # pull requests every job is skipped; under workflow_call the caller's
  # event name is not pull_request, so the lanes run unconditionally.
  stable-checks:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.ref == 'release/lockstep' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        !github.event.pull_request.draft)
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TESTED_SHA }}
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      # Packed consumers execute the CLI: stage the production layout from a
      # real host Go executable (verify-consumer + toolchain packed test).
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: packages/cli/go/go.mod
      - name: Build the host native CLI
        run: bun run turbo run build:go --filter=@octane-xplat/cli
      - run: bun run build:packages
      - name: Check packed exports and declaration dependencies
        run: bun run check:pack
      - name: Check packed consumers without a browser
        run: >-
          bun run turbo run test:packed --filter='./packages/*'
          --filter='!@octane-xplat/web-host' --filter='!@octane-xplat/workshop' --concurrency=2
      - name: Verify packed web starter install and compilation
        run: bun run check:consumer --no-build --quick

  native-ios:
    runs-on: macos-latest
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.ref == 'release/lockstep' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        !github.event.pull_request.draft)
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TESTED_SHA }}
          submodules: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # verify-consumer stages the published CLI layout from the host Go build.
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: packages/cli/go/go.mod
      - name: Build the host native CLI
        run: bun run turbo run build:go --filter=@octane-xplat/cli

      # Compile the packed starter into a simulator-debug .app.
      - name: Prepare and validate packed consumer packages
        run: |
          bun run build:packages
          bun run check:pack

      - name: Packed consumer iOS build
        run: node scripts/with-target-lock.ts ios -- node scripts/verify-consumer.ts --no-build --native-build-only --native ios

  native-android:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.ref == 'release/lockstep' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        !github.event.pull_request.draft)
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TESTED_SHA }}
          submodules: true

      - name: Setup Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # verify-consumer stages the published CLI layout from the host Go build.
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: packages/cli/go/go.mod
      - name: Build the host native CLI
        run: bun run turbo run build:go --filter=@octane-xplat/cli

      # Compile the packed starter into a debug .apk.
      - name: Prepare and validate packed consumer packages
        run: |
          bun run build:packages
          bun run check:pack

      - name: Packed consumer Android build
        run: node scripts/with-target-lock.ts android -- node scripts/verify-consumer.ts --no-build --native-build-only --native android
        env:
          # ns gates `build` on its doctor check, which requires a working
          # `emulator` binary — unused by a build-only lane and absent/broken
          # on hosted ubuntu runners. The gradle build itself is the gate.
          NS_SKIP_ENV_CHECK: 'true'

  # Evidence records the tested sha and its tree: a merge commit has a new sha
  # but an identical tree, so tree-keyed artifacts let a clean merge publish
  # without re-running these lanes. Recorded on the pull request only —
  # called runs qualify the release in place and record nothing.
  evidence:
    runs-on: ubuntu-latest
    needs: [stable-checks, native-ios, native-android]
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'release/lockstep' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TESTED_SHA }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Bun owns the dependency cache; disable setup-node's automatic caching.
          package-manager-cache: false
      - name: Record stable qualification
        id: evidence
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          tree="$(git rev-parse "$TESTED_SHA^{tree}")"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          node scripts/verify-release-evidence.ts record --track stable \
            --jobs "$JOB_RESULTS" --sha "$TESTED_SHA" --tree "$tree" \
            --run-id "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v6
        with:
          name: ci-evidence-stable-${{ steps.evidence.outputs.tree }}
          path: .ci-evidence/ci-evidence.json
          if-no-files-found: error
          retention-days: 90
