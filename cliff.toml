# git-cliff config for automated releases (.github/workflows/release.yml).
# Two release tracks share this config; the workflow selects commits and tags
# per track via --include-path/--exclude-path/--tag-pattern:
#   - lockstep packages: `vX.Y.Z` tags over all shipped packages
#   - tsrx-typegen: `tsrx-typegen-vX.Y.Z` tags over packages/tsrx-typegen only

[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "0.1.0"

[remote.github]
owner = "octane-xplat"
repo = "octane-xplat"

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = false
filter_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
commit_parsers = [
	{ message = "^[a-z]+\\(ci\\)!?:", skip = true },
	{ message = "^[a-z]+(\\([^)]*\\))?!:", group = "Breaking Changes" },
	{ footer = "BREAKING[ -]CHANGE", group = "Breaking Changes" },
	{ message = "^feat", group = "Features" },
	{ message = "^fix", group = "Bug Fixes" },
	{ message = "^perf", group = "Performance" },
	{ message = "^revert", group = "Reverts" },
	{ message = "^refactor", group = "Refactoring" },
	# Docs changes ride the pre-release docs sweep, not the changelog.
	{ message = "^docs?", skip = true },
	{ message = "^test", skip = true },
	{ message = "^ci", skip = true },
	{ message = "^chore", skip = true },
	{ message = "^build", skip = true },
	{ message = "^style", skip = true },
]
