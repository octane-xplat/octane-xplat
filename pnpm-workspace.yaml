packages:
  - apps/*
  - packages/*
# isolated (pnpm default): each workspace package gets real dep symlinks in its
# own node_modules. Required by @nativescript/vite — its vendor-manifest and
# HMR code reads projectRoot/node_modules/<pkg>/package.json and fails
# silently on hoisted layouts (deep-path vendor requires miss the registry).
nodeLinker: isolated
# @nativescript/core imports tslib at runtime; keep it reachable.
publicHoistPattern:
  - tslib
# Pin chokidar to one version repo-wide. sass wants ^5 and vite-plugin-static-copy
# wants ^3; the .pnpm public store then holds chokidar@5 + readdirp@3 — a broken
# pairing that crashes vite's bundled-config eval under `ns run` (its externals
# resolve through the store). sass only uses chokidar for `sass --watch`, which
# nothing here invokes; chokidar3+readdirp3 is the coherent pair.
overrides:
  chokidar: ^3.6.0
  # vite 8's esbuild peer range admits 0.28.x; where octane/app-core peer
  # contexts resolve it fresh they get 0.28.2 while vite's own tree carries
  # 0.27.7 — the vendor bundler then crashes on the host/binary mismatch.
  # Pin everything to vite's 0.27.7 except wrangler, which wants its own.
  esbuild: 0.27.7
  wrangler>esbuild: 0.28.1
  # tiptap 3.28.0 is the line @octanejs/tiptap pins. Its extension packages
  # declare ^3.28.0 ranges that float to 3.31.x, which imports core symbols
  # (getPreviousBlockSibling) that 3.28.0 lacks — pin the whole family.
  '@tiptap/core': 3.28.0
  '@tiptap/pm': 3.28.0
  '@tiptap/starter-kit': 3.28.0
  '@tiptap/static-renderer': 3.28.0
  '@tiptap/extensions': 3.28.0
  '@tiptap/extension-blockquote': 3.28.0
  '@tiptap/extension-bold': 3.28.0
  '@tiptap/extension-bullet-list': 3.28.0
  '@tiptap/extension-code': 3.28.0
  '@tiptap/extension-code-block': 3.28.0
  '@tiptap/extension-document': 3.28.0
  '@tiptap/extension-dropcursor': 3.28.0
  '@tiptap/extension-gapcursor': 3.28.0
  '@tiptap/extension-hard-break': 3.28.0
  '@tiptap/extension-heading': 3.28.0
  '@tiptap/extension-horizontal-rule': 3.28.0
  '@tiptap/extension-italic': 3.28.0
  '@tiptap/extension-link': 3.28.0
  '@tiptap/extension-list': 3.28.0
  '@tiptap/extension-list-item': 3.28.0
  '@tiptap/extension-list-keymap': 3.28.0
  '@tiptap/extension-ordered-list': 3.28.0
  '@tiptap/extension-paragraph': 3.28.0
  '@tiptap/extension-strike': 3.28.0
  '@tiptap/extension-text': 3.28.0
  '@tiptap/extension-underline': 3.28.0
# Exact pins in package.json — no caret/tilde drift on fresh installs.
saveExact: true
minimumReleaseAgeExclude:
  - '@octanejs/app-core@0.0.56'
  - '@octanejs/vite-plugin@0.1.61'
  - octane@0.6.3
  - '@nativescript-community/octane@0.2.4'
  - '@nativescript-community/vite-octane@0.2.1'
  - '@nativescript/vite@8.0.17'
  - '@tsrx/core@0.3.2'
  - '@tsrx/typescript-plugin@0.4.11'
  - '@nativescript/canvas@3.0.0-alpha.15'
  # Windows spike: prerelease runtime + dev-tag CLI carrying the unreleased
  # windows platform (cli#6065). Exact pins in apps/windows/package.json.
  - '@nativescript/windows@0.1.0-alpha.144'
  - nativescript@9.1.2-dev.2026-09-24-36031892256
  - '@octanejs/tiptap@0.0.51'
allowBuilds:
  '@nativescript/core': true
  nativescript: true
  '@nativescript/core@https://pkg.pr.new/@nativescript/core@7d0adce': true
  '@parcel/watcher': true
  esbuild: true
  workerd: true
  '@nativescript/core@https://pkg.pr.new/@nativescript/core@7d0adce(patch_hash=801830817bbdddb11afa8fa8afd1b62c879e6473b8cfed37f2d6932be109b661)': true
  # firebase (web push) postinstalls: @firebase/util's is a React Native
  # bundling shim, protobufjs's prints a deprecation banner — neither needed.
  '@firebase/util': false
  protobufjs: false
# Canonical copies live in packages/cli/patches/ — manifest.json there carries
# why/dropWhen per entry and feeds `xplat patches apply`. Regenerate a patch with `pnpm
# patch`/`pnpm patch-commit` (it writes to the configured path), then `pnpm sync:patches`
# propagates it to @octane-xplat/patches. `pnpm check:patches` fails on drift.
patchedDependencies:
  # Published octane 0.6.3 lacks live signal reads under universal renderers. Adds signal
  # ownership, read tracking, and local signal hooks; JSX prop lowering and __methodDep
  # already ship upstream. Routes uncaught universal event-handler errors to onUncaughtError
  # when configured. Pins instance signal/query declarations to their declaring owner so
  # child reads and event handlers share one request. Also allows async and generator
  # helpers that are not components in universal compiler modules, while preserving errors
  # when those functions are used as components (octanejs/octane#1469).
  octane@0.6.3: packages/cli/patches/octane@0.6.3.patch
  # FlexboxLayout getChildMeasureSpec subtracts the child's own padding where AOSP subtracts
  # parent padding + child margins — a column-stretched row re-measurement clamps padded
  # children (37→17 dip, squished controls). Adds squircle (continuous) corner clipping for
  # iOS backgrounds and CSS @layer cascade support to the native css-tree adapter (layer
  # nodes, first-seen layerPath ordinals, layer rank ahead of specificity with unlayered
  # last — sans !important). Ports the runtime half of NativeScript PR #11446 (fixes
  # #11444): TabView onItemsChanged keeps retained items attached instead of
  # unloading/re-adding them (the churn that left TabViewItem-hosted Frames isLoaded=false
  # on iOS and detached from their tab fragment on Android), iOS items writes load the
  # selected item's view once controllers exist, and Frame._pushInFrameStack only promotes
  # frames whose ancestors present them (Frame.topmost stops returning hidden preloaded tab
  # frames). Also maps CSS font-weight to the OpenType wght axis for custom Android fonts on
  # API 26+, preserves explicit variation settings, and falls back to the prior file load
  # when the axis is unsupported. Carries NativeScript PR #11481: preserves percentage
  # translate values through parsing and resolves each axis against the view's own
  # dimensions, including native views and animations.
  "@nativescript/core@9.1.2": packages/cli/patches/@nativescript__core@9.1.2.patch
  # @nativescript/types@9.0.0 omits ambient declarations for the native URL and
  # URLSearchParams globals, so projects without DOM libraries cannot typecheck valid native
  # URL code. Adds runtime-aligned declarations that merge with DOM declarations when both
  # libraries are present.
  "@nativescript/types@9.0.0": packages/cli/patches/@nativescript__types@9.0.0.patch
  # @nativescript/vite serializes bundled CSS and dev app.css through reworkcss `css`@3.0.0,
  # which mis-parses @layer into garbage selectors — rules die before reaching
  # _populateRules. Adds atlayer() covering block and statement forms. Applies to a
  # transitive dep — no app declares it directly.
  css@3.0.0: packages/cli/patches/css@3.0.0.patch
  # Dev-server fixes still missing after @nativescript/vite 8.0.17 added percent decoding
  # for path-style /ns/m and Vue /ns/sfc requests (NativeScript#11483): collect re-export
  # specifiers in the .vite/deps rewrite, route /@fs paths outside both roots through /ns/m
  # (linked checkouts bypass the device transform upstream), and probe the non-active
  # platform + `native` suffix tags in module candidates. The deps-bundle esbuild passes
  # ignore vite resolve.alias, so a dep importing bare `octane` bundles the DOM runtime
  # beside the universal one (hooks crash on boot, octane-xplat#3) — an onResolve plugin
  # redirects `octane` → `octane/universal/native`. tsconfig-paths and the generated
  # build-time checker moduleSuffixes also need the `.mobile` tier for iOS/Android/visionOS
  # so `.mobile` leaves resolve under mapped imports and `ns build`.
  "@nativescript/vite@8.0.17": packages/cli/patches/@nativescript__vite@8.0.17.patch
  # Driver setProp skips `undefined` writes — NativeScript native setters coerce it (e.g.
  # editable → ios.userInteractionEnabled = NO), leaving dead UI that still has its JS
  # listeners. Advertises the implemented visibility capability so committed suspense bodies
  # can be retained while pending.
  "@nativescript-community/octane@0.2.4": packages/cli/patches/@nativescript-community__octane@0.2.4.patch
  # octaneServerStrategy's SCRIPT_FILE_RE only covers [jt]sx? — .tsrx edits never emit the
  # deferred ns:hmr-delta broadcast, so component HMR silently never reaches the device.
  # Also counts open /ns-hmr sockets so the update summary stops reporting recipients=0 for
  # delivered updates.
  "@nativescript-community/vite-octane@0.2.1": packages/cli/patches/@nativescript-community__vite-octane@0.2.1.patch
  # apps/windows pins the @7d0adce pkg.pr.new preview based on @nativescript/vite 8.0.13, so
  # its separate patch carries /ns/m re-export records, vendor-manifest gating for
  # plugin-patterned packages, percent-decoding (the preview predates 8.0.17/#11483), and
  # .mobile-aware tsconfig-paths probing.
  "@nativescript/vite@8.0.13": packages/cli/patches/@nativescript__vite@8.0.13.patch
  # Windows spike: the shared-file subset of the 9.1.2 patch — @layer cascade machinery
  # (css-tree parser, css-selector, style-scope), the #11446 frame/tab-view common fixes,
  # and the flexbox common measure-spec — applied to the @7d0adce preview. iOS/Android
  # impl-file hunks are dead code on windows and were dropped.
  "@nativescript/core@9.1.3-next.2": packages/cli/patches/@nativescript__core@9.1.3-next.2.patch
  # Enables `resolveHiddenExtensions` on the language plugin's typescript facet so
  # extensionless specifiers (e.g. './Text') probe `.tsrx` after moduleSuffixes — required
  # for a single extensionless shared barrel to resolve per-platform leaves under tsrx-tsc
  # and the IDE plugin.
  "@tsrx/typescript-plugin@0.4.11": packages/cli/patches/@tsrx__typescript-plugin@0.4.11.patch
  # linkifyjs declares /\p{L}/u and /\p{Emoji}/u as regex literals at module scope;
  # NativeScript's embedded V8 builds without ICU, so the literals throw SyntaxError at
  # parse time and poison the whole bundle (any bundled app importing @tiptap/extension-link
  # dies on boot). Rewrites them as try/catch new RegExp builds with ASCII-range fallbacks —
  # same behavior where ICU exists, graceful degradation where it doesn't.
  linkifyjs@4.3.3: packages/cli/patches/linkifyjs@4.3.3.patch
  # Two bundler-visible issues: useEditor.ts reads bare process.env.NODE_ENV (no node global
  # in the harness typecheck program) and './Context' resolves to Context.tsrx — a
  # self-import — under suffix-first resolution, so EditorContext/useCurrentEditor were
  # unreachable. Adds a module-local process declaration for typecheck and merges the
  # Context.ts definitions into Context.tsrx.
  "@octanejs/tiptap@0.0.51": packages/cli/patches/@octanejs__tiptap@0.0.51.patch
  # @lexical/link declares a /\p{L}\p{N}/u URL matcher as a regex literal at module scope;
  # NativeScript's embedded V8 builds without ICU, so the literal throws SyntaxError at
  # parse time and poisons the whole bundle (any bundled app importing @lexical/link dies on
  # boot). Same fix as linkifyjs: try/catch new RegExp with an ASCII-range fallback — the
  # matcher only feeds autolink, which native doesn't use.
  "@lexical/link@0.51.0": packages/cli/patches/@lexical__link@0.51.0.patch
