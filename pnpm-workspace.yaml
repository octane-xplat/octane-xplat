packages:
  - apps/*
  - packages/*
# isolated (pnpm default): each workspace package gets real dep symlinks in its
# own node_modules. Required by @nativescript/vite — its vendor-manifest and
# HMR code reads projectRoot/node_modules/<pkg>/package.json and fails
# silently on hoisted layouts (deep-path vendor requires miss the registry).
nodeLinker: isolated
# @nativescript/core imports tslib at runtime; keep it reachable.
publicHoistPattern:
  - tslib
# Pin chokidar to one version repo-wide. sass wants ^5 and vite-plugin-static-copy
# wants ^3; the .pnpm public store then holds chokidar@5 + readdirp@3 — a broken
# pairing that crashes vite's bundled-config eval under `ns run` (its externals
# resolve through the store). sass only uses chokidar for `sass --watch`, which
# nothing here invokes; chokidar3+readdirp3 is the coherent pair.
overrides:
  chokidar: ^3.6.0
# Exact pins in package.json — no caret/tilde drift on fresh installs.
saveExact: true
minimumReleaseAgeExclude:
  - '@octanejs/app-core@0.0.54'
  - '@octanejs/vite-plugin@0.1.58'
  - octane@0.4.0
  - '@nativescript-community/octane@0.2.1'
  - '@nativescript-community/vite-octane@0.2.1'
  - '@nativescript/vite@8.0.11'
allowBuilds:
  '@nativescript/core': true
  '@parcel/watcher': true
  esbuild: true
  workerd: true
# Reserved-word export fix for the dev-session deps/core bundle shims:
# buildDepsShimCode/buildCoreSubShimCode filtered names like `enum` out of the
# generated export surface entirely (zod exports `enum`/`catch`/`function`/
# `instanceof`/`null`/`void` → `z.enum is not a function` on device). The patch
# emits them as temp+`export { t as name }` aliases — legal ES2015, since the
# export-name position accepts any IdentifierName. Remove once upstream
# (@nativescript/vite, packages/vite/hmr/server/deps-bundle.ts +
# core-bundle.ts in NativeScript/NativeScript) ships the same fix.
#
# octane@0.4.0: universal compiler miscompiled `@else if` chains (else thunk
# returned an empty range). Remove once a release carries octanejs/octane#1297.
patchedDependencies:
  '@nativescript/vite@8.0.11': patches/@nativescript__vite@8.0.11.patch
  octane@0.4.0: patches/octane@0.4.0.patch
