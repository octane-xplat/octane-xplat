packages:
  - apps/*
  - packages/*
# isolated (pnpm default): each workspace package gets real dep symlinks in its
# own node_modules. Required by @nativescript/vite — its vendor-manifest and
# HMR code reads projectRoot/node_modules/<pkg>/package.json and fails
# silently on hoisted layouts (deep-path vendor requires miss the registry).
nodeLinker: isolated
# @nativescript/core imports tslib at runtime; keep it reachable.
publicHoistPattern:
  - tslib
# Versions that must stay aligned across official packages: runtime
# singletons (octane, @nativescript/* — one copy per app), the shared
# toolchain, and the patched native renderer whose type-level augmentations
# (e.g. ui's type-support/svg-element.d.ts) only apply to the resolved copy.
catalog:
  octane: 0.14.0
  '@nativescript-community/octane': 0.2.5
  '@nativescript-community/vite-octane': 0.2.1
  '@nativescript/core': 9.1.3
  '@nativescript/types': 9.1.4
  '@nativescript/types-android': 9.1.1
  '@nativescript/types-ios': 9.1.3
  '@nativescript/macos-node-api': 0.4.4-next.2026-08-09-31292056208
  '@nativescript/unit-test-runner': 5.0.0
  typescript: 5.9.3
  vite: 8.3.0
  '@octanejs/vite-plugin': 0.1.61
  '@tsrx/typescript-plugin': 0.4.11
  # vitest 4 line repo-wide: platform peers pin <5 alongside
  # @nativescript/unit-test-runner, and visual's @vitest/browser family must
  # match — vitest 5 would split the runner's module identity.
  vitest: 4.1.11
  jsdom: 30.1.1
# patchedDependencies carries the full served patch set (e.g. both
# @nativescript-community/octane lines); the workspace may not install all of
# them — tolerate entries that apply to nothing.
allowUnusedPatches: true
# Pin chokidar to one version repo-wide. sass wants ^5 and vite-plugin-static-copy
# wants ^3; the .pnpm public store then holds chokidar@5 + readdirp@3 — a broken
# pairing that crashes vite's bundled-config eval under `ns run` (its externals
# resolve through the store). sass only uses chokidar for `sass --watch`, which
# nothing here invokes; chokidar3+readdirp3 is the coherent pair.
overrides:
  chokidar: ^3.6.0
  # vite 8's esbuild peer range admits 0.28.x; where octane/app-core peer
  # contexts resolve it fresh they get 0.28.2 while vite's own tree carries
  # 0.27.7 — the vendor bundler then crashes on the host/binary mismatch.
  # Pin everything to vite's 0.27.7 except wrangler, which wants its own.
  esbuild: 0.27.7
  wrangler>esbuild: 0.28.1
  # tiptap 3.28.0 is the line @octanejs/tiptap pins. Its extension packages
  # declare ^3.28.0 ranges that float to 3.31.x, which imports core symbols
  # (getPreviousBlockSibling) that 3.28.0 lacks — pin the whole family.
  '@tiptap/core': 3.28.0
  '@tiptap/pm': 3.28.0
  '@tiptap/starter-kit': 3.28.0
  '@tiptap/static-renderer': 3.28.0
  '@tiptap/extensions': 3.28.0
  '@tiptap/extension-blockquote': 3.28.0
  '@tiptap/extension-bold': 3.28.0
  '@tiptap/extension-bullet-list': 3.28.0
  '@tiptap/extension-code': 3.28.0
  '@tiptap/extension-code-block': 3.28.0
  '@tiptap/extension-document': 3.28.0
  '@tiptap/extension-dropcursor': 3.28.0
  '@tiptap/extension-gapcursor': 3.28.0
  '@tiptap/extension-hard-break': 3.28.0
  '@tiptap/extension-heading': 3.28.0
  '@tiptap/extension-horizontal-rule': 3.28.0
  '@tiptap/extension-italic': 3.28.0
  '@tiptap/extension-link': 3.28.0
  '@tiptap/extension-list': 3.28.0
  '@tiptap/extension-list-item': 3.28.0
  '@tiptap/extension-list-keymap': 3.28.0
  '@tiptap/extension-ordered-list': 3.28.0
  '@tiptap/extension-paragraph': 3.28.0
  '@tiptap/extension-strike': 3.28.0
  '@tiptap/extension-text': 3.28.0
  '@tiptap/extension-underline': 3.28.0
# Exact pins in package.json — no caret/tilde drift on fresh installs.
saveExact: true
minimumReleaseAgeExclude:
  # Trusted upstream release; allow this version immediately.
  - '@nativescript-community/ui-image@5.0.18'
  - '@nativescript/core@9.1.3'
  - '@octanejs/app-core@0.0.56'
  - '@octanejs/vite-plugin@0.1.61'
  - octane@0.14.0
  - '@nativescript-community/octane@0.2.4'
  - '@nativescript-community/octane@0.2.5'
  - '@nativescript-community/vite-octane@0.2.1'
  - '@nativescript/vite@8.0.20'
  # octane 0.14.0 pulls these tsrx versions; the template pins @tsrx/oxc 0.20.0.
  - '@tsrx/core@0.5.5'
  - '@tsrx/oxc@0.20.0'
  - '@tsrx/core@0.3.2'
  - '@tsrx/typescript-plugin@0.4.11'
  # same-day releases of our formatter; platform binaries ship together.
  - '@octane-xplat/fmt@0.1.0'
  - '@octane-xplat/fmt-darwin-arm64@0.1.0'
  - '@octane-xplat/fmt-darwin-x64@0.1.0'
  - '@octane-xplat/fmt-linux-arm64-gnu@0.1.0'
  - '@octane-xplat/fmt-linux-arm64-musl@0.1.0'
  - '@octane-xplat/fmt-linux-x64-gnu@0.1.0'
  - '@octane-xplat/fmt-linux-x64-musl@0.1.0'
  - '@octane-xplat/fmt-win32-arm64@0.1.0'
  - '@octane-xplat/fmt-win32-x64@0.1.0'
  # First core beta is explicitly selected by the mobile proving harnesses.
  - '@octane-xplat/nativescript-mason-core@1.0.0-beta.0'
  # same-day release of our MasonKit fork
  - '@octane-xplat/nativescript-masonkit@1.0.0-beta.126'
  - '@nativescript/canvas@3.0.0-alpha.15'
  # Windows spike: prerelease runtime + dev-tag CLI carrying the unreleased
  # windows platform (cli#6065). Exact pins in apps/windows/package.json.
  - '@nativescript/windows@0.1.0-alpha.144'
  - nativescript@9.1.2-dev.2026-09-24-36031892256
  - '@octanejs/tiptap@0.0.52'
  - '@nativescript/types@9.1.4'
  - shaders@4.0.0
allowBuilds:
  '@nativescript/core': true
  nativescript: true
  '@nativescript/core@https://pkg.pr.new/@nativescript/core@abae298': true
  '@parcel/watcher': true
  esbuild: true
  workerd: true
  '@nativescript/core@https://pkg.pr.new/@nativescript/core@abae298(patch_hash=2e79fd94932603cd559e340568664b38ab22c13326ab75eeeb5bb08dc8bc4c03)': true
  # firebase (web push) postinstalls: @firebase/util's is a React Native
  # bundling shim, protobufjs's prints a deprecation banner — neither needed.
  '@firebase/util': false
  protobufjs: false
# Canonical copies live in packages/cli/patches/ — manifest.json there carries
# why/dropWhen per entry and feeds `xplat patches apply`. Regenerate a patch with `pnpm
# patch`/`pnpm patch-commit` (it writes to the configured path), then `pnpm sync:patches`
# propagates it to @octane-xplat/patches. `pnpm check:patches` fails on drift.
patchedDependencies:
  # Published 0.14.0 still requires renderer-owned Children.toArray/map with explicit
  # universal-native re-exports for older runtimes, universal signal-read tracking and local
  # hooks, root event-error forwarding, the complete universal imperative-ref lifecycle, the
  # Descriptor declaring-owner reader fallback, and the signal-owner/enclosingOwner chain so
  # child reads reuse instance declarations. Rebased against the registry 0.14.0 tarball,
  # including local signal-hook registration in the split runtime/hooks modules. Provider
  # null/undefined descendant cleanup is now upstream and no longer patched. Marks generic
  # binding bags from bagOf so fragment commit rehomes their DOM parent references,
  # preventing stale fragment parents, namespace recursion, and invalid insertion during
  # typeahead updates. Preserves keyed component ownership through compiler-generated
  # transparent root slots so native map reorders retain host identity, state, and portal
  # content.
  octane@0.14.0: packages/cli/patches/octane@0.14.0.patch
  # Published 9.1.3 ships the #11446 nested-tab-frame lifecycle fix and iOS explicit-size
  # flex alignment, so those hunks are removed. Retains the unshipped parent-padding
  # measure-spec fix and Android explicit-size flex alignment, iOS continuous corner
  # clipping, CSS @layer cascade support, custom Android variable-font weight mapping, and
  # percentage translate parsing, native view, and animation support. Verified against the
  # registry 9.1.3 tarball; it has no Windows implementation, so the separate Windows
  # preview patch remains.
  "@nativescript/core@9.1.3": packages/cli/patches/@nativescript__core@9.1.3.patch
  # @nativescript/vite serializes bundled CSS and dev app.css through reworkcss `css`@3.0.0,
  # which mis-parses @layer into garbage selectors — rules die before reaching
  # _populateRules. Adds atlayer() covering block and statement forms. Applies to a
  # transitive dep — no app declares it directly.
  css@3.0.0: packages/cli/patches/css@3.0.0.patch
  # Remaining dev-server fixes on @nativescript/vite 8.0.20: classify only the requested
  # vendor entry under active native ESM conditions, keeping mixed
  # source-root/compiled-subpath packages on the Vite transform path; collect re-export
  # specifiers in the .vite/deps rewrite; route outside-roots /@fs paths through /ns/m;
  # probe non-active platform and native suffixes; redirect bare octane to
  # octane/universal/native in deps-bundle esbuild passes; add .mobile to tsconfig-paths and
  # generated checker suffixes; scan the app-local pnpm virtual store for served
  # node_modules URLs; ignore per-package turbo.json as workspace markers; resolve #
  # package-imports specifiers in served-module rewrites; preserve, compile, and hot-update
  # virtual stylesheets (NativeScript#11551); and inspect ESM export declarations/specifiers
  # for native default-import validation instead of matching comments, strings, or a narrow
  # export syntax (NativeScript#11566). Shared-source graph and hot-context IDs now use the
  # same app/workspace/@fs paths as served imports, preserving distinct roots
  # (NativeScript#11569); extensionless workspace requests probe filesystem-anchored
  # extension/platform candidates so hot reimports can fetch shared modules
  # (NativeScript#11570). Linked-checkout discovery and candidate anchoring shipped in
  # 8.0.20 (NativeScript#11559), so those local hunks are removed.
  "@nativescript/vite@8.0.20": packages/cli/patches/@nativescript__vite@8.0.20.patch
  # Driver treats a prop dropped from an update's complete prop bag — or set to
  # `undefined`/`null` — as a removal and restores the documented default:
  # Property/CssProperty setters get `unsetValue`, plain fields restore the captured
  # pre-prop value, and applied `style` keys diff per key. A never-applied `undefined` still
  # skips the write since NativeScript native setters coerce it (e.g. editable →
  # ios.userInteractionEnabled = NO). Aligns intrinsic ref types with Octane callback
  # cleanup and nested arrays with optional entries. Advertises the implemented visibility
  # capability so committed suspense bodies can be retained while pending. Preserves
  # authored Grid row/col/span metadata independently of NativeScript defaults and computed
  # auto-placement, notifying Grid when placement props change.
  "@nativescript-community/octane@0.2.4": packages/cli/patches/@nativescript-community__octane@0.2.4.patch
  # Retains the workspace's NativeScript driver fixes when upgrading to 0.2.5 for portal
  # support: a prop dropped from an update's complete prop bag — or set to
  # `undefined`/`null` — is a removal that restores the documented default
  # (Property/CssProperty setters get `unsetValue`, plain fields the captured pre-prop
  # value, `style` keys diff per key); a never-applied `undefined` still skips the write.
  # Synced with PR #14: registered setters are identified before resetting (ordinary fields
  # never receive the sentinel), inline removal refreshes matching class CSS through the
  # isolated core 9.1 `_cssState.onChange` hook, CSS variables use public removal, strings
  # use the core CSS parser, and replacement views capture fresh defaults. Also advertises
  # the implemented visibility capability, carries Octane callback ref types, and preserves
  # authored Grid row/col/span metadata. Hosts custom-layout containers (e.g. MasonKit
  # ViewBase) that own child lists via insertChild/removeChild/getChildrenCount without
  # subclassing LayoutBase. Additionally, the masonry cutover: masonview resolves to
  # MasonKit View and scrollview to MasonKit Scroll as the only layout containers, with zero
  # layout props — every former prop name warns-and-drops and all CSS semantics arrive
  # through the style bag; foreign native leaves mirror resolved class and inline layout
  # styles through Style.fromView, observe longhand changes and native recreation, and
  # explicitly clear removed placement — removal restores the CSS cascade, so a later
  # sibling attachment cannot resurrect removed tracks. Container alignment uses the core
  # stretch default without a local style override, allowing class-authored centering.
  # Inline style resets reapply the matching CSS cascade. Re-exports Octane's ClassValue
  # unchanged and stringifies truthy numeric class values while omitting 0 and NaN, matching
  # Octane 0.11. Maps collapsed foreign native leaves to Mason display:none, restoring
  # effective display on visibility changes so both layout hosts omit the same item (#45).
  "@nativescript-community/octane@0.2.5": packages/cli/patches/@nativescript-community__octane@0.2.5.patch
  # octaneServerStrategy's SCRIPT_FILE_RE only covers [jt]sx? — .tsrx edits never emit the
  # deferred ns:hmr-delta broadcast, so component HMR silently never reaches the device.
  # Also counts open /ns-hmr sockets so the update summary stops reporting recipients=0 for
  # delivered updates. Includes shared script sources in transaction ordering while
  # excluding dependencies, tests and declarations. External-source edits use the absolute
  # source for graph identity and a Vite /@fs transform URL instead of treating
  # parent-relative paths as app URLs.
  "@nativescript-community/vite-octane@0.2.1": packages/cli/patches/@nativescript-community__vite-octane@0.2.1.patch
  # Windows preview abae298 from NativeScript#11272 uses Vite 8.0.21. Retains /ns/m
  # re-export records, outside-root /@fs routing through the device transform, and
  # .mobile-aware tsconfig-paths probing. Vendor-manifest gating and percent-decoded module
  # paths are now upstream and no longer patched.
  "@nativescript/vite@8.0.21": packages/cli/patches/@nativescript__vite@8.0.21.patch
  # Windows preview abae298 from NativeScript#11272 retains CSS @layer cascade machinery and
  # explicit-size flex alignment, Windows pointer subscription and hover ownership,
  # cancellation/capture-loss handling and gesture separation, parent-driven percentage
  # sizing lifecycle and padded content-box updates, input focus/blur ownership, IsEnabled
  # forwarding, accessible names, secure readonly, and literal non-CSS property values. The
  # #11446 frame/tab fixes are now upstream and removed. Preserves upstream
  # transparent-background hit testing and contact-only pointer moves. Registry core
  # 9.1.4-next.0 has no Windows implementation; this patch targets the commit-pinned preview
  # with that version.
  "@nativescript/core@9.1.4-next.0": packages/cli/patches/@nativescript__core@9.1.4-next.0.patch
  # Enables `resolveHiddenExtensions` on the language plugin's typescript facet so
  # extensionless specifiers (e.g. './Text') probe `.tsrx` after moduleSuffixes — required
  # for a single extensionless shared barrel to resolve per-platform leaves under tsrx-tsc
  # and the IDE plugin.
  "@tsrx/typescript-plugin@0.4.11": packages/cli/patches/@tsrx__typescript-plugin@0.4.11.patch
  # linkifyjs declares /\p{L}/u and /\p{Emoji}/u as regex literals at module scope;
  # NativeScript's embedded V8 builds without ICU, so the literals throw SyntaxError at
  # parse time and poison the whole bundle (any bundled app importing @tiptap/extension-link
  # dies on boot). Rewrites them as try/catch new RegExp builds with ASCII-range fallbacks —
  # same behavior where ICU exists, graceful degradation where it doesn't.
  linkifyjs@4.3.3: packages/cli/patches/linkifyjs@4.3.3.patch
  # useEditor.ts reads bare process.env.NODE_ENV — no node global exists in the harness
  # typecheck program. Adds a module-local process declaration for typecheck. (The
  # './Context' self-import half of the 0.0.51 patch shipped upstream in 0.0.52 via
  # octanejs/octane#1502.)
  "@octanejs/tiptap@0.0.52": packages/cli/patches/@octanejs__tiptap@0.0.52.patch
  # @lexical/link declares a /\p{L}\p{N}/u URL matcher as a regex literal at module scope;
  # NativeScript's embedded V8 builds without ICU, so the literal throws SyntaxError at
  # parse time and poisons the whole bundle (any bundled app importing @lexical/link dies on
  # boot). Same fix as linkifyjs: try/catch new RegExp with an ASCII-range fallback — the
  # matcher only feeds autolink, which native doesn't use.
  "@lexical/link@0.51.0": packages/cli/patches/@lexical__link@0.51.0.patch
  # @nativescript/doctor's Android runtime check reads the app's raw devDependencies
  # specifier and npm dist-tag resolves anything that isn't a semver range — a pnpm
  # `catalog:` pin throws 'The determined Android runtime version ... is not valid' and
  # kills `ns build android` before toolchain checks. Resolve catalog specifiers through the
  # installed package's manifest, reusing the existing tgz-branch mechanism.
  "@nativescript/doctor@2.0.18": packages/cli/patches/@nativescript__doctor@2.0.18.patch
  # shaders@4.0.0 inlines TypeGPU 0.12.3 into dist/core/std-ClftfWpF.js, which declares
  # /\p{XID_Start}/ and /\p{XID_Continue}/ regex literals at module scope (WGSL identifier
  # validation, external prop-chain matching, minify separator check). NativeScript's
  # embedded V8 on iOS (@nativescript/ios 9.1.0) and Android (@nativescript/android 9.1.1,
  # V8 14.9.207.39) is built without ICU — every \p{…} escape is a SyntaxError, even in a
  # never-called function, so a literal fails the whole module at parse time and any bundled
  # app importing `shaders/js` dies on boot. Rewriting to \p{ID_Start}/\p{L} would not help
  # — all property escapes are rejected. The patch builds the regexes via try/catch new
  # RegExp with ASCII/non-ASCII-range fallbacks — byte-identical .source where ICU exists.
  # dist/js/bundle.js, react/bundle.js, and cli.js carry the same escapes but are
  # unreachable from `shaders/js` and left unpatched.
  shaders@4.0.0: packages/cli/patches/shaders@4.0.0.patch
